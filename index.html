/* 常時表示の説明文はやめ、白塗りを初めて選んだときだけ一度知らせる。
   見た目を隠すだけだと誤解されると実害が出るため、ここだけは伝える。 */
var toldWhite = false;
function tipForTool(k){
  if (k === "white" && !toldWhite){
    toldWhite = true;
    toast("白塗りは文字データごと消します。このページは画像として書き出されます", 4600);
  }
}

var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if (!e.isIntersecting) return;
    var p = byUid(+e.target.dataset.uid);
    if (p && !p.rendered) renderSheet(p);
  });
}, {root: stage, rootMargin: "500px 0px"});

function byUid(uid){
  for (var i=0;i<S.pages.length;i++) if (S.pages[i].uid === uid) return S.pages[i];
  return null;
}

async function renderSheet(p){
  if (!p.el) return;
  p.rendered = true;
  var d = dispSize(p, S.zoom);
  var c1 = p.el.querySelector(".pdfc"), c2 = p.el.querySelector(".anc");
  c1.width = Math.round(d.w * dpr); c1.height = Math.round(d.h * dpr);
  c2.width = c1.width; c2.height = c1.height;

  if (p.blank){
    var g = c1.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0,0,c1.width,c1.height);
    p.vp = null;
    paintSheet(p);
    return;
  }
  var page = await getPdfPage(p);
  var vp = page.getViewport({scale: S.zoom, rotation: totalRot(p)});
  p.vp = vp;
  if (p.task){ try{ p.task.cancel(); }catch(e){} }
  var ctx = c1.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,c1.width,c1.height);
  p.task = page.render({
    canvasContext: ctx,
    viewport: page.getViewport({scale: S.zoom * dpr, rotation: totalRot(p)})
  });
  try { await p.task.promise; } catch(e){ /* cancelled */ }
  p.task = null;
  paintSheet(p);
}

/* pdf.js の PageViewport と同じ式で、PDF座標 -> 画面の変換行列を作る。
   白紙ページや描画前のページには pdf.js の viewport が無いため、これを使う。
   以前は回転を無視した行列にしていたため、回転した白紙ページに書いた内容が
   ページの外の座標に保存され、書き出すと消えていた。 */
function viewTransform(box, scale, rotation){
  var cx = (box[2] + box[0]) / 2, cy = (box[3] + box[1]) / 2;
  var r = ((rotation % 360) + 360) % 360, A, B, C, D;
  if (r === 90)       { A = 0;  B = 1;  C = 1;  D = 0;  }
  else if (r === 180) { A = -1; B = 0;  C = 0;  D = 1;  }
  else if (r === 270) { A = 0;  B = -1; C = -1; D = 0;  }
  else                { A = 1;  B = 0;  C = 0;  D = -1; }
  var ox, oy;
  if (A === 0){ ox = Math.abs(cy - box[1]) * scale; oy = Math.abs(cx - box[0]) * scale; }
  else        { ox = Math.abs(cx - box[0]) * scale; oy = Math.abs(cy - box[1]) * scale; }
  return [A * scale, B * scale, C * scale, D * scale,
          ox - A * scale * cx - C * scale * cy,
          oy - B * scale * cx - D * scale * cy];
}
function matrixFor(p){
  var t = p.vp ? p.vp.transform
               : viewTransform([p.vx0, p.vy0, p.vx0 + p.pw, p.vy1], S.zoom, totalRot(p));
  return [t[0]*dpr, t[1]*dpr, t[2]*dpr, t[3]*dpr, t[4]*dpr, t[5]*dpr];
}
function toScreen(p, x, y){   // pdf pt -> css px inside sheet
  var m = matrixFor(p);
  return [ (m[0]*x + m[2]*y + m[4]) / dpr, (m[1]*x + m[3]*y + m[5]) / dpr ];
}
function toPdf(p, cx, cy){    // css px inside sheet -> pdf pt
  var m = matrixFor(p), a=m[0]/dpr,b=m[1]/dpr,c=m[2]/dpr,d=m[3]/dpr,e=m[4]/dpr,f=m[5]/dpr;
  var det = a*d - b*c;
  var x = cx - e, y = cy - f;
  return [ (d*x - c*y)/det, (a*y - b*x)/det ];
}

/* ------------------------------------------------------ annotation paint */
function flipped(ctx, x, yTop, fn){
  ctx.save(); ctx.translate(x, yTop); ctx.scale(1,-1); fn(); ctx.restore();
}
/* 回転したページでも文字がまっすぐ見えるよう、テキストは置いたときのページの向き（a.r）を覚える。
   画面の右向き・下向きが、PDFの座標でどちらを向くかを返す [右x, 右y, 下x, 下y]。 */
function orient(r){
  switch (((r || 0) % 360 + 360) % 360){
    case 90:  return [0, 1, 1, 0];
    case 180: return [-1, 0, 0, 1];
    case 270: return [0, -1, -1, 0];
    default:  return [1, 0, 0, -1];
  }
}
function uprightAt(ctx, x, y, r, fn){
  var o = orient(r);
  ctx.save(); ctx.transform(o[0], o[1], o[2], o[3], x, y); fn(); ctx.restore();
}
function wrapText(ctx, text, maxW){
  var out = [], paras = String(text).split("\n");
  for (var q=0;q<paras.length;q++){
    var para = paras[q];
    if (!para){ out.push(""); continue; }
    var line = "", chars = Array.from(para);
    for (var i=0;i<chars.length;i++){
      var ch = chars[i], t = line + ch;
      if (line && ctx.measureText(t).width > maxW){
        if (NO_START.indexOf(ch) >= 0){ out.push(t); line = ""; }
        else { out.push(line); line = ch; }
      } else line = t;
    }
    if (line) out.push(line);
  }
  return out.length ? out : [""];
}
function textMetrics(ctx, a){
  ctx.font = a.size + "px " + annotFont(a);
  var lines = wrapText(ctx, a.text, a.w);
  var lh = a.size * 1.5;
  return {lines: lines, lh: lh, h: Math.max(lh, lines.length * lh)};
}
function drawAnnot(ctx, a){
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (a.t === "pen" || a.t === "marker"){
    ctx.strokeStyle = a.t === "marker" ? hexA(a.c, 0.38) : a.c;
    ctx.lineWidth = a.w;
    if (a.t === "marker"){ ctx.lineCap = "butt"; ctx.lineJoin = "round"; }
    ctx.beginPath();
    var pts = a.p;
    if (pts.length === 1){ ctx.arc(pts[0][0], pts[0][1], a.w/2, 0, 6.2832); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); }
    else{
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i=1;i<pts.length-1;i++){
        var mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
        ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
      ctx.stroke();
    }
  } else if (a.t === "rect"){
    ctx.strokeStyle = a.c; ctx.lineWidth = a.w;
    ctx.strokeRect(a.x, a.y, a.w2, a.h2);
  } else if (a.t === "white"){
    ctx.fillStyle = a.c || "#ffffff";
    ctx.fillRect(a.x, a.y, a.w2, a.h2);
  } else if (a.t === "line"){
    ctx.strokeStyle = a.c; ctx.lineWidth = a.w;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + a.w2, a.y + a.h2); ctx.stroke();
  } else if (a.t === "text"){
    var m = textMetrics(ctx, a);
    uprightAt(ctx, a.x, a.y, a.r, function(){
      ctx.font = a.size + "px " + annotFont(a);
      ctx.fillStyle = a.c; ctx.textBaseline = "alphabetic";
      for (var i=0;i<m.lines.length;i++) ctx.fillText(m.lines[i], 0, (i + 0.98) * m.lh);
    });
    a._h = m.h;
  } else if (a.t === "image"){
    var rec = S.images.get(a.img);
    if (rec && rec.el.complete){
      flipped(ctx, a.x, a.y + a.h2, function(){ ctx.drawImage(rec.el, 0, 0, a.w2, a.h2); });
    }
  }
  ctx.restore();
}
function bbox(ctx, a){
  if (a.t === "pen" || a.t === "marker"){
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    a.p.forEach(function(q){ x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]); });
    var pad = a.w/2 + 2;
    return {x:x0-pad, y:y0-pad, w:(x1-x0)+pad*2, h:(y1-y0)+pad*2};
  }
  if (a.t === "text"){
    var h = a._h || (ctx ? textMetrics(ctx,a).h : a.size*1.5), o = orient(a.r);
    var xs = [a.x, a.x + o[0]*a.w, a.x + o[2]*h, a.x + o[0]*a.w + o[2]*h];
    var ys = [a.y, a.y + o[1]*a.w, a.y + o[3]*h, a.y + o[1]*a.w + o[3]*h];
    var tx = Math.min.apply(null, xs), ty = Math.min.apply(null, ys);
    return {x:tx, y:ty, w:Math.max.apply(null, xs) - tx, h:Math.max.apply(null, ys) - ty};
  }
  if (a.t === "line"){
    return {x: Math.min(a.x, a.x+a.w2)-3, y: Math.min(a.y, a.y+a.h2)-3,
            w: Math.abs(a.w2)+6, h: Math.abs(a.h2)+6};
  }
  return {x:a.x, y:a.y, w:a.w2, h:a.h2};
}
function paintSheet(p){
  if (!p.el) return;
  var c = p.el.querySelector(".anc");
  if (!c.width) return;
  var ctx = c.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,c.width,c.height);
  var m = matrixFor(p);
  ctx.save();
  ctx.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
  p.annots.forEach(function(a){ drawAnnot(ctx, a); });
  drawFindHits(ctx, p);
  ctx.restore();

  if (S.active && S.active.p === p){
    var b = bbox(ctx, S.active.a);
    var c1 = toScreen(p, b.x, b.y), c2 = toScreen(p, b.x+b.w, b.y+b.h);
    var x0 = Math.min(c1[0],c2[0])*dpr, y0 = Math.min(c1[1],c2[1])*dpr;
    var x1 = Math.max(c1[0],c2[0])*dpr, y1 = Math.max(c1[1],c2[1])*dpr;
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.strokeStyle = "#2f5d8f"; ctx.lineWidth = 1.5*dpr;
    ctx.setLineDash([5*dpr,4*dpr]);
    ctx.strokeRect(x0-3, y0-3, (x1-x0)+6, (y1-y0)+6);
    ctx.setLineDash([]);
    ctx.fillStyle = "#2f5d8f";
    ctx.fillRect(x1-1, y1-1, 9*dpr, 9*dpr);
    ctx.restore();
  }
}
function repaintAll(){
  S.pages.forEach(function(p){ if (p.rendered) paintSheet(p); });
  refreshToolClass();
  syncFloatbar();
}

/* ------------------------------------------ 選んだ書き込みの上に出る道具 */
/* 遠くのツールバーまで往復せずに、その場で色・太さ・複製・削除ができる。 */
var fbar = null, sheetDragging = false;
function killFloatbar(){
  if (fbar){ fbar.remove(); fbar = null; }
}
function annotColors(a){
  return a.t !== "white" && a.t !== "image";
}
function annotWidth(a){
  return a.t === "pen" || a.t === "marker" || a.t === "rect" || a.t === "line";
}
function buildFloatbar(){
  var el = document.createElement("div");
  el.className = "floatbar";
  el.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
  return el;
}
function syncFloatbar(){
  var act = S.active;
  if (!act || !act.p || !act.p.el || S.tool !== "select" || S.editing){ killFloatbar(); return; }
  if (sheetDragging){ if (fbar) fbar.style.visibility = "hidden"; return; }
  if (fbar) fbar.style.visibility = "";
  var p = act.p, a = act.a;
  if (!fbar){ fbar = buildFloatbar(); }

  /* 中身は注釈の種類に合わせて組み直す */
  var narrow = window.matchMedia("(max-width:760px)").matches;
  var sig = a.t + ":" + a.id + ":" + (narrow ? "n" : "w");
  if (fbar.dataset.sig !== sig){
    fbar.dataset.sig = sig;
    fbar.textContent = "";
    if (!narrow && annotColors(a)){
      var lb = document.createElement("label"); lb.textContent = "色";
      var host = document.createElement("div"); host.className = "swatches";
      host.style.padding = "0 5px";
      COLORS.forEach(function(c){
        var b = document.createElement("button");
        b.type = "button"; b.className = "sw"; b.style.background = c;
        b.setAttribute("aria-label", "色 " + c);
        b.dataset.color = c;
        b.setAttribute("aria-pressed", c === a.c ? "true" : "false");
        b.addEventListener("click", function(){
          pushHistory(); a.c = c; S.color = c;
          syncSwatches(); paintSheet(p); markThumb(p); syncFloatbar();
        });
        host.appendChild(b);
      });
      fbar.appendChild(lb); fbar.appendChild(host);
    }
    if (!narrow && annotWidth(a)){
      var lw = document.createElement("label"); lw.textContent = "太さ";
      var rg = document.createElement("input");
      rg.type = "range"; rg.min = "1"; rg.max = "18"; rg.step = "1";
      rg.value = String(a.t === "marker" ? Math.round(a.w / 4) : a.w);
      rg.setAttribute("aria-label", "太さ");
      rg.addEventListener("pointerdown", function(){ pushHistory(); });
      rg.addEventListener("input", function(){
        var v = +rg.value;
        a.w = (a.t === "marker") ? v * 4 : v;
        paintSheet(p); markThumb(p);
      });
      fbar.appendChild(lw); fbar.appendChild(rg);
    }
    if (!narrow && a.t === "text"){
      var lf = document.createElement("label"); lf.textContent = "書体";
      var sf = document.createElement("select");
      sf.setAttribute("aria-label", "書体");
      Array.from($("selFont").options).forEach(function(o){
        var c = document.createElement("option");
        c.value = o.value; c.textContent = o.textContent;
        c.style.fontFamily = o.style.fontFamily;
        if (o.value === (a.font || "gothic")) c.selected = true;
        sf.appendChild(c);
      });
      sf.addEventListener("change", function(){
        pushHistory(); a.font = sf.value; S.font = sf.value;
        try { localStorage.setItem("pdfk.font", S.font); } catch(e){}
        $("selFont").value = sf.value;
        paintSheet(p); markThumb(p); syncFloatbar();
      });
      fbar.appendChild(lf); fbar.appendChild(sf);

      var ls = document.createElement("label"); ls.textContent = "大きさ";
      var se = document.createElement("select");
      se.setAttribute("aria-label", "文字の大きさ");
      [9,10.5,12,14,16,20,24,32].forEach(function(v){
        var o = document.createElement("option");
        o.value = String(v); o.textContent = String(v);
        if (v === a.size) o.selected = true;
        se.appendChild(o);
      });
      se.addEventListener("change", function(){
        pushHistory(); a.size = parseFloat(se.value); S.size = a.size;
        $("selSize").value = se.value;
        paintSheet(p); markThumb(p); syncFloatbar();
      });
      fbar.appendChild(ls); fbar.appendChild(se);
    }
    var dup = document.createElement("button");
    dup.type = "button"; dup.className = "fb";
    dup.innerHTML = svg(ICON.dup) + "<span>複製</span>";
    dup.addEventListener("click", function(){ duplicateAnnot(p, a); });
    var del = document.createElement("button");
    del.type = "button"; del.className = "fb danger";
    del.innerHTML = svg(ICON.del) + "<span>削除</span>";
    del.addEventListener("click", function(){ deleteAnnot(p, a); });
    fbar.appendChild(dup); fbar.appendChild(del);
    var tip = document.createElement("span"); tip.className = "tip";
    fbar.appendChild(tip);
  }

  if (fbar.parentNode !== p.el) p.el.appendChild(fbar);

  /* 選択範囲の上に置く。上が詰まっていれば下に回す。 */
  var ctx = p.el.querySelector(".anc").getContext("2d");
  var b = bbox(ctx, a);
  var c1 = toScreen(p, b.x, b.y), c2 = toScreen(p, b.x + b.w, b.y + b.h);
  var left = Math.min(c1[0], c2[0]), right = Math.max(c1[0], c2[0]);
  var top = Math.min(c1[1], c2[1]), bottom = Math.max(c1[1], c2[1]);
  var w = fbar.offsetWidth, h = fbar.offsetHeight;
  var cx = (left + right) / 2;
  var x = clamp(cx - w / 2, 4, Math.max(4, p.el.clientWidth - w - 4));
  var y = top - h - 12;
  var below = false;
  var sheetTop = p.el.getBoundingClientRect().top - stage.getBoundingClientRect().top;
  if (sheetTop + y < 8){ y = bottom + 12; below = true; }
  fbar.classList.toggle("below", below);
  fbar.style.left = Math.round(x) + "px";
  fbar.style.top  = Math.round(y) + "px";
  fbar.style.setProperty("--tipx", Math.round(clamp(cx - x - 5, 10, Math.max(10, w - 20))) + "px");
}
function duplicateAnnot(p, a){
  pushHistory();
  var copy = JSON.parse(JSON.stringify(a));
  copy.id = ++S.uid;
  var d = 10;
  if (copy.p) copy.p = copy.p.map(function(q){ return [q[0] + d, q[1] - d]; });
  else { copy.x += d; copy.y -= d; }
  p.annots.push(copy);
  S.active = {p:p, a:copy};
  paintSheet(p); markThumb(p); syncFloatbar();
}
function deleteAnnot(p, a){
  pushHistory();
  var i = p.annots.indexOf(a);
  if (i >= 0) p.annots.splice(i, 1);
  S.active = null;
  killFloatbar();
  paintSheet(p); markThumb(p);
}

/* --------------------------------------------- 2本指でのスクロールと拡大縮小 */
/* 1本目の指は描く、2本目が触れたら描きかけを取り消して画面操作に切り替える。
   操作中は CSS の transform で見た目だけ動かし、指を離したときに実際の
   倍率と スクロール位置へ反映する（毎フレーム再描画すると重いため）。 */
var abortSheetDrag = null;
var touchPts = new Map(), pinch = null;

function ptList(){ return Array.from(touchPts.values()); }
function ptDist(a, b){ return Math.hypot(b.x - a.x, b.y - a.y); }
function ptMid(a, b){ return {x:(a.x + b.x)/2, y:(a.y + b.y)/2}; }

function pinchBegin(){
  if (abortSheetDrag){ abortSheetDrag(); abortSheetDrag = null; }
  var q = ptList(), sr = sheets.getBoundingClientRect(), c = ptMid(q[0], q[1]);
  pinch = {
    d0: Math.max(1, ptDist(q[0], q[1])),
    c0: c,
    anchor: {x: c.x - sr.left, y: c.y - sr.top},   // sheetwrap 内の掴んだ点
    zoom0: S.zoom, scale: 1
  };
  sheets.style.transformOrigin = "0 0";
  sheets.style.willChange = "transform";
}
function pinchMove(){
  if (!pinch) return;
  var q = ptList();
  if (q.length < 2) return;
  var s = clamp(ptDist(q[0], q[1]) / pinch.d0, 0.25/pinch.zoom0, 4/pinch.zoom0);
  var c = ptMid(q[0], q[1]);
  var sr = sheets.getBoundingClientRect();
  // transform 前の原点を求めるため、現在の transform を打ち消して計算する
  var baseLeft = sr.left - (pinch.tx || 0), baseTop = sr.top - (pinch.ty || 0);
  pinch.scale = s;
  pinch.tx = c.x - baseLeft - s * pinch.anchor.x;
  pinch.ty = c.y - baseTop  - s * pinch.anchor.y;
  sheets.style.transform = "translate(" + pinch.tx + "px," + pinch.ty + "px) scale(" + s + ")";
  $("zLabel").textContent = Math.round(S.zoom * s * 100) + "%";
}
function pinchEnd(){
  if (!pinch) return;
  var g = pinch; pinch = null;
  sheets.style.transform = "";
  sheets.style.willChange = "";
  var newZoom = clamp(g.zoom0 * g.scale, 0.25, 4);
  var k = newZoom / g.zoom0;
  setZoom(newZoom);                       // ここでシートが組み直される
  // 掴んでいた点が、指を離した位置にそのまま来るようにスクロールを合わせる
  var sr = sheets.getBoundingClientRect();
  var want = g.lastC || g.c0;
  stage.scrollLeft += (sr.left + g.anchor.x * k) - want.x;
  stage.scrollTop  += (sr.top  + g.anchor.y * k) - want.y;
}

/* Ctrl（Mac は ⌘ も）＋ホイールで拡大縮小。トラックパッドのピンチも
   ブラウザからは Ctrl 付きのホイールとして届く。止めないとブラウザが
   ボタンまで含めた画面全体を拡大してしまう。
   2本指ピンチと同じく、回している間は見た目だけ動かし、止まったら
   実際の倍率で描き直す。カーソルの下の点がずれないようにする。 */
var wheelZ = null, wheelTimer = null;
function wheelZoomEnd(){
  if (!wheelZ) return;
  var g = wheelZ; wheelZ = null;
  pinch = {anchor: g.anchor, zoom0: g.zoom0, scale: g.scale, c0: g.c, lastC: g.c};
  pinchEnd();
}
stage.addEventListener("wheel", function(e){
  if (!(e.ctrlKey || e.metaKey) || !S.pages.length) return;
  e.preventDefault();
  if (pinch) return;                              // 2本指の操作中は任せる
  if (!wheelZ){
    var sr = sheets.getBoundingClientRect();
    wheelZ = {anchor: {x: e.clientX - sr.left, y: e.clientY - sr.top},
              c: {x: e.clientX, y: e.clientY}, zoom0: S.zoom, scale: 1, tx: 0, ty: 0};
    sheets.style.transformOrigin = "0 0";
    sheets.style.willChange = "transform";
  }
  // マウスのホイールは1目盛り100前後、トラックパッドは細かい値で届く
  var step = (e.deltaMode === 1) ? e.deltaY * 33 : e.deltaY;
  wheelZ.scale = clamp(wheelZ.scale * Math.exp(-step * 0.0015),
                       0.25 / wheelZ.zoom0, 4 / wheelZ.zoom0);
  wheelZ.c = {x: e.clientX, y: e.clientY};
  var sr2 = sheets.getBoundingClientRect();
  var baseLeft = sr2.left - wheelZ.tx, baseTop = sr2.top - wheelZ.ty;
  wheelZ.tx = wheelZ.c.x - baseLeft - wheelZ.scale * wheelZ.anchor.x;
  wheelZ.ty = wheelZ.c.y - baseTop  - wheelZ.scale * wheelZ.anchor.y;
  sheets.style.transform = "translate(" + wheelZ.tx + "px," + wheelZ.ty + "px) scale(" + wheelZ.scale + ")";
  $("zLabel").textContent = Math.round(wheelZ.zoom0 * wheelZ.scale * 100) + "%";
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(wheelZoomEnd, 180);
}, {passive: false});

stage.addEventListener("pointerdown", function(e){
  if (e.pointerType !== "touch") return;
  touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (touchPts.size === 2) pinchBegin();
}, true);
stage.addEventListener("pointermove", function(e){
  if (e.pointerType !== "touch" || !touchPts.has(e.pointerId)) return;
  touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && touchPts.size >= 2){
    var q = ptList();
    pinch.lastC = ptMid(q[0], q[1]);
    pinchMove();
  }
}, true);
function touchGone(e){
  if (e.pointerType !== "touch") return;
  touchPts.delete(e.pointerId);
  if (pinch && touchPts.size < 2) pinchEnd();
}
stage.addEventListener("pointerup", touchGone, true);
stage.addEventListener("pointercancel", touchGone, true);

/* ------------------------------------------------------------ 文字を探す */
var textCache = new Map();
function pageText(p){
  if (p.blank) return Promise.resolve([]);
  var key = p.docId + ":" + p.srcIndex;
  if (textCache.has(key)) return textCache.get(key);
  var pr = getPdfPage(p).then(function(pg){
    return pg.getTextContent();
  }).then(function(tc){
    return tc.items.filter(function(it){ return it.str && it.str.trim(); }).map(function(it){
      var t = it.transform;
      var h = it.height || Math.abs(t[3]) || 10;
      return {str: it.str, x: t[4], y: t[5], w: it.width || 0, h: h};
    });
  }).catch(function(){ return []; });
  textCache.set(key, pr);
  return pr;
}
function syncFind(){
  var f = S.find;
  $("findCount").textContent = !f.q ? ""
    : (f.hits.length ? (f.idx + 1) + " / " + f.hits.length : "見つかりません");
  $("findPrev").disabled = $("findNext").disabled = f.hits.length < 2;
}
async function runFind(q){
  var f = S.find;
  f.q = q; f.hits = []; f.idx = -1;
  if (q){
    var needle = q.toLowerCase();
    for (var i=0;i<S.pages.length;i++){
      var p = S.pages[i];
      var items = await pageText(p);
      for (var j=0;j<items.length;j++){
        if (items[j].str.toLowerCase().indexOf(needle) >= 0)
          f.hits.push({uid:p.uid, x:items[j].x, y:items[j].y, w:items[j].w, h:items[j].h});
      }
    }
  }
  syncFind();
  repaintAll();
  if (f.hits.length) gotoHit(0);
}
function gotoHit(k){
  var f = S.find;
  if (!f.hits.length) return;
  f.idx = ((k % f.hits.length) + f.hits.length) % f.hits.length;
  var h = f.hits[f.idx], p = byUid(h.uid);
  if (p && p.el){
    // ページの上端ではなく、一致した箇所そのものが見えるところまで動かす
    var at = toScreen(p, h.x, h.y);
    stage.scrollTo({
      left: p.el.offsetLeft + at[0] - stage.clientWidth / 2,
      top:  p.el.offsetTop  + at[1] - stage.clientHeight / 2,
      behavior: "smooth"
    });
  }
  syncFind();
  repaintAll();
}
function drawFindHits(ctx, p){
  var f = S.find;
  if (!f.q || !f.hits.length) return;
  for (var i=0;i<f.hits.length;i++){
    var h = f.hits[i];
    if (h.uid !== p.uid) continue;
    ctx.fillStyle = (i === f.idx) ? "rgba(255,150,0,.45)" : "rgba(255,225,0,.35)";
    ctx.fillRect(h.x, h.y - h.h * 0.22, h.w, h.h * 1.2);
  }
}

/* ------------------------------------------------------- ページ番号で移動 */
function currentPageIndex(){
  var best = 0, bestD = Infinity, mid = stage.clientHeight / 2;
  for (var i=0;i<S.pages.length;i++){
    var el = S.pages[i].el;
    if (!el) continue;
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var d = Math.abs((r.top + r.height/2) - (sr.top + mid));
    if (d < bestD){ bestD = d; best = i; }
  }
  return best;
}
function syncPageNo(){
  var el = $("pgoIn");
  if (document.activeElement !== el) el.value = S.pages.length ? (currentPageIndex() + 1) : "";
  if (typeof syncDocMeta === "function") syncDocMeta();
}
function syncFindEnabled(){
  $("findIn").disabled = !S.pages.length;
}
function gotoPage(n){
  var i = clamp(Math.round(n) - 1, 0, S.pages.length - 1);
  var p = S.pages[i];
  if (p && p.el) p.el.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ------------------------------------------------------------ interaction */
function bindSheet(p, canvas){
  var drag = null;
  /* 2本目の指が触れたときに、描きかけを取り消して拡大縮小に切り替えるため */
  function abortDrag(){
    if (!drag) return;
    var a = drag.a;
    if (drag.mode === "create"){
      p.annots.splice(p.annots.indexOf(a), 1);
      histPop(S.history); syncUndo();
    } else if (drag.mode === "move" || drag.mode === "resize"){
      Object.keys(drag.orig).forEach(function(k){ a[k] = drag.orig[k]; });
      histPop(S.history); syncUndo();
    }
    drag = null; S.active = null; sheetDragging = false;
    paintSheet(p); markThumb(p); syncFloatbar();
  }
  canvas.addEventListener("pointerdown", function(e){
    if (pinch){ drag = null; return; }             // 2本指の操作中は描き始めない
    if (e.button != null && e.button !== 0) return; // 右クリックは描き始めない
    abortSheetDrag = abortDrag;
    if (S.editing) commitText();
    e.preventDefault();   // ブラウザ既定のフォーカス移動を止める（入力欄が閉じてしまうため）
    var r = canvas.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    var pt = toPdf(p, cx, cy);
    canvas.setPointerCapture(e.pointerId);
    selectPage(p.uid, false, false, true);
    var ctx = canvas.getContext("2d");

    if (S.tool === "erase"){
      var hit = hitTest(p, ctx, pt);
      if (hit){ pushHistory(); p.annots.splice(p.annots.indexOf(hit),1); S.active=null; paintSheet(p); markThumb(p); }
      drag = null; return;
    }
    if (S.tool === "select"){
      // 選択中の書き込みのつまみ（画面で見て枠の右下、枠の少し外）を先に調べる
      var hit2 = null, near = false;
      if (S.active && S.active.p === p){
        var sa = screenBox(p, bbox(ctx, S.active.a));
        if (Math.abs(cx - (sa.x1 + 4)) < 12 && Math.abs(cy - (sa.y1 + 4)) < 12){ hit2 = S.active.a; near = true; }
      }
      if (!hit2) hit2 = hitTest(p, ctx, pt);
      if (hit2){
        var b = bbox(ctx, hit2), sb = screenBox(p, b);
        S.active = {p:p, a:hit2};
        pushHistory();
        drag = {mode: near ? "resize" : "move", a: hit2, start: pt, orig: JSON.parse(JSON.stringify(hit2)), box: b, sbox: sb};
        sheetDragging = true;
      } else {
        S.active = null;
        if (e.pointerType === "touch"){
          // 何も掴んでいない指の動きは、画面のスクロールにあてる
          drag = {mode:"pan", sx:e.clientX, sy:e.clientY, sl:stage.scrollLeft, st:stage.scrollTop};
        }
      }
      repaintAll(); return;
    }
    if (S.tool === "text"){
      var hit3 = hitTest(p, ctx, pt, "text");
      if (hit3){ startText(p, hit3); return; }
      var r0 = totalRot(p), o0 = orient(r0);
      var room = o0[0] > 0 ? p.vx0 + p.pw - pt[0] : o0[0] < 0 ? pt[0] - p.vx0
               : o0[1] > 0 ? p.vy1 - pt[1] : pt[1] - p.vy0;
      var a = {id:++S.uid, t:"text", x:pt[0], y:pt[1], w:Math.max(60, Math.min(240, room - 12)),
               text:"", size:S.size, c:S.color, font:S.font, r:r0};
      startText(p, a, true);
      return;
    }
    pushHistory();
    var na;
    if (S.tool === "pen" || S.tool === "marker"){
      na = {id:++S.uid, t:S.tool, c:S.color, w:(S.tool==="marker"? S.width*4 : S.width), p:[pt]};
    } else if (S.tool === "white"){
      na = {id:++S.uid, t:"white", c:"#ffffff", x:pt[0], y:pt[1], w2:0, h2:0};
    } else if (S.tool === "line"){
      na = {id:++S.uid, t:"line", c:S.color, w:S.width, x:pt[0], y:pt[1], w2:0, h2:0};
    } else {
      na = {id:++S.uid, t:"rect", c:S.color, w:S.width, x:pt[0], y:pt[1], w2:0, h2:0};
    }
    p.annots.push(na);
    drag = {mode:"create", a:na, start:pt};
    sheetDragging = true;
    paintSheet(p);
  });

  canvas.addEventListener("pointermove", function(e){
    if (!drag) return;
    var r = canvas.getBoundingClientRect();
    if (drag.mode === "pan"){
      stage.scrollLeft = drag.sl - (e.clientX - drag.sx);
      stage.scrollTop  = drag.st - (e.clientY - drag.sy);
      return;
    }
    var pt = toPdf(p, e.clientX - r.left, e.clientY - r.top);
    var a = drag.a;
    if (drag.mode === "create"){
      if (a.t === "pen" || a.t === "marker"){
        var last = a.p[a.p.length-1];
        if (Math.abs(last[0]-pt[0]) + Math.abs(last[1]-pt[1]) > 0.8) a.p.push(pt);
      } else {
        a.w2 = pt[0] - drag.start[0];
        a.h2 = pt[1] - drag.start[1];
        if (a.t !== "line"){
          a.x = Math.min(drag.start[0], pt[0]); a.y = Math.min(drag.start[1], pt[1]);
          a.w2 = Math.abs(a.w2); a.h2 = Math.abs(a.h2);
        }
      }
    } else if (drag.mode === "move"){
      var dx = pt[0]-drag.start[0], dy = pt[1]-drag.start[1], o = drag.orig;
      if (a.p) a.p = o.p.map(function(q){ return [q[0]+dx, q[1]+dy]; });
      else { a.x = o.x + dx; a.y = o.y + dy; }
    } else if (drag.mode === "resize"){
      // 画面で見た左上を動かさず、右下のつまみに合わせて大きさを変える（ページの回転によらない）
      var o2 = drag.orig, sb = drag.sbox, ob = drag.box;
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      var sw = sb.x1 - sb.x0, sh = sb.y1 - sb.y0, min = 6 * S.zoom;
      var nw = Math.max(min, mx - sb.x0), nh = Math.max(min, my - sb.y0);
      if (a.t === "text"){
        var ot = orient(a.r);
        a.w = Math.max(28, (pt[0] - a.x) * ot[0] + (pt[1] - a.y) * ot[1]);
      } else if (a.t === "line"){
        // つまみに近いほうの端を指に合わせる
        var e1 = toScreen(p, o2.x, o2.y), e2 = toScreen(p, o2.x + o2.w2, o2.y + o2.h2);
        var d1 = Math.hypot(e1[0] - sb.x1, e1[1] - sb.y1), d2 = Math.hypot(e2[0] - sb.x1, e2[1] - sb.y1);
        if (d2 <= d1){ a.w2 = pt[0] - o2.x; a.h2 = pt[1] - o2.y; }
        else { var ex = o2.x + o2.w2, ey = o2.y + o2.h2; a.x = pt[0]; a.y = pt[1]; a.w2 = ex - pt[0]; a.h2 = ey - pt[1]; }
      } else {
        if (a.t === "image" && !e.shiftKey && sw > 0 && sh > 0){
          var k = Math.max(nw / sw, nh / sh, 0.15);
          nw = sw * k; nh = sh * k;
        }
        var nb = pdfBox(p, sb.x0, sb.y0, sb.x0 + nw, sb.y0 + nh);
        if (a.p){
          // 線の太さぶんの余白は広げずに、線の通り道だけを伸び縮みさせる
          var pd = o2.w / 2 + 2;
          var kx = Math.max(1, nb.w - pd*2) / Math.max(0.01, ob.w - pd*2);
          var ky = Math.max(1, nb.h - pd*2) / Math.max(0.01, ob.h - pd*2);
          a.p = o2.p.map(function(q){ return [nb.x + pd + (q[0] - ob.x - pd) * kx, nb.y + pd + (q[1] - ob.y - pd) * ky]; });
        } else {
          a.x = nb.x; a.y = nb.y; a.w2 = nb.w; a.h2 = nb.h;
        }
      }
    }
    paintSheet(p);
  });

  function endDrag(){
    if (!drag) return;
    abortSheetDrag = null;
    sheetDragging = false;
    if (drag.mode === "pan"){ drag = null; syncFloatbar(); return; }
    var a = drag.a;
    if (drag.mode === "create" && a.t !== "pen" && a.t !== "marker"
        && Math.abs(a.w2) < 3 && Math.abs(a.h2) < 3){
      p.annots.splice(p.annots.indexOf(a),1);
      histPop(S.history); syncUndo();
    } else if (drag.mode === "create"){
      S.active = {p:p, a:a};
    }
    drag = null;
    paintSheet(p); markThumb(p); syncFloatbar();
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("dblclick", function(e){
    var r = canvas.getBoundingClientRect();
    var pt = toPdf(p, e.clientX - r.left, e.clientY - r.top);
    var hit = hitTest(p, canvas.getContext("2d"), pt, "text");
    if (hit) startText(p, hit);
  });
}

/* PDF座標の箱を、画面上の箱（左上と右下）にする */
function screenBox(p, b){
  var c1 = toScreen(p, b.x, b.y), c2 = toScreen(p, b.x + b.w, b.y + b.h);
  return {x0:Math.min(c1[0], c2[0]), y0:Math.min(c1[1], c2[1]), x1:Math.max(c1[0], c2[0]), y1:Math.max(c1[1], c2[1])};
}
/* 画面上の箱を、PDF座標の箱にする */
function pdfBox(p, x0, y0, x1, y1){
  var c1 = toPdf(p, x0, y0), c2 = toPdf(p, x1, y1);
  var x = Math.min(c1[0], c2[0]), y = Math.min(c1[1], c2[1]);
  return {x:x, y:y, w:Math.abs(c2[0] - c1[0]), h:Math.abs(c2[1] - c1[1])};
}
function hitTest(p, ctx, pt, onlyType){
  for (var i = p.annots.length-1; i >= 0; i--){
    var a = p.annots[i];
    if (onlyType && a.t !== onlyType) continue;
    var b = bbox(ctx, a);
    var pad = 4;
    if (pt[0] >= b.x-pad && pt[0] <= b.x+b.w+pad && pt[1] >= b.y-pad && pt[1] <= b.y+b.h+pad) return a;
  }
  return null;
}

/* ----------------------------------------------------------- text editing */
function startText(p, a, isNew){
  S.editing = {p:p, a:a, isNew: !!isNew};
  var z = S.zoom, rot = ((totalRot(p) - (a.r || 0)) % 360 + 360) % 360;
  var tl = toScreen(p, a.x, a.y);
  p.el.appendChild(ted);
  ted.hidden = false;
  ted.value = a.text || "";
  ted.style.fontFamily = annotFont(a);
  ted.style.fontSize = (a.size * z) + "px";
  ted.style.lineHeight = "1.5";
  ted.style.width = (a.w * z) + "px";
  ted.style.left = tl[0] + "px";
  ted.style.top = tl[1] + "px";
  ted.style.transform = "rotate(" + rot + "deg)";
  ted.style.color = (a.c === "#ffffff") ? "#15202b" : a.c;
  autoSize();
  setTimeout(function(){
    if (!S.editing) return;
    ted.focus();
    ted.setSelectionRange(ted.value.length, ted.value.length);
    S.editing.ready = true;
  }, 0);
}
function autoSize(){ ted.style.height = "auto"; ted.style.height = (ted.scrollHeight + 2) + "px"; }
function hideEditor(){
  ted.hidden = true; ted.value = "";
  document.body.appendChild(ted);
}
function commitText(){
  if (!S.editing) return;
  var e = S.editing, a = e.a, p = e.p, v = ted.value;
  S.editing = null; hideEditor();
  if (e.isNew){
    if (!v.trim()) return;
    pushHistory(); a.text = v; p.annots.push(a); S.active = {p:p, a:a};
  } else {
    if (v === a.text) return;
    pushHistory(); a.text = v;
    if (!v.trim()) p.annots.splice(p.annots.indexOf(a),1);
  }
  paintSheet(p); markThumb(p);
}
ted.addEventListener("input", autoSize);
ted.addEventListener("blur", function(){
  // 開いた直後にフォーカスが外れた場合は取り消さず、入力欄を保つ
  if (S.editing && !S.editing.ready){ setTimeout(function(){ if (S.editing) ted.focus(); }, 0); return; }
  commitText();
});
ted.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ e.preventDefault(); S.editing = null; ted.blur(); hideEditor(); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); ted.blur(); }
  e.stopPropagation();
});

/* --------------------------------------------------------------- thumbnails */
/* サムネイル。元ページの描画は重いので元ページ単位で使い回し、書き込みの
   あるページだけ、その上に書き込みを重ねた画像を別に作る。
   ページ整理で大きく表示してもぼやけにくいよう、一覧の表示幅の2倍で描く。 */
var THUMB_W = 220;
var thumbCache = new Map();       // 元ページの描画（canvas）  キー: 元ページ+回転
var thumbUrls = new Map();        // その画像URL
var markedThumbs = new Map();     // 書き込みを重ねた画像  uid -> {sig, url}
function thumbKey(p){ return p.docId + ":" + p.srcIndex + ":" + totalRot(p) + (p.blank ? ":b" : ""); }
function baseThumb(p){
  var key = thumbKey(p);
  if (thumbCache.has(key)) return thumbCache.get(key);
  var pr = (async function(){
    var s = THUMB_W / p.pw;
    var c = document.createElement("canvas");
    if (p.blank){
      var d = dispSize(p, s);
      c.width = Math.round(d.w); c.height = Math.round(d.h);
      var g0 = c.getContext("2d"); g0.fillStyle = "#fff"; g0.fillRect(0, 0, c.width, c.height);
      return c;
    }
    var page = await getPdfPage(p);
    var vp = page.getViewport({scale: s, rotation: totalRot(p)});
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: g, viewport: vp}).promise;
    return c;
  })();
  thumbCache.set(key, pr);
  return pr;
}
/* 書き込みの中身が変わったかを見分ける。描画のたびに付く _h（文字の高さの
   覚え書き）は内容ではないので外す。 */
function annotSig(p){
  return totalRot(p) + ":" + JSON.stringify(p.annots, function(k, v){ return k === "_h" ? undefined : v; });
}
async function thumbFor(p){
  var base = await baseThumb(p);
  if (!p.annots.length){
    var k = thumbKey(p);
    if (!thumbUrls.has(k)) thumbUrls.set(k, base.toDataURL(p.blank ? "image/png" : "image/jpeg", 0.8));
    return thumbUrls.get(k);
  }
  var sig = annotSig(p), hit = markedThumbs.get(p.uid);
  if (hit && hit.sig === sig) return hit.url;
  var c = document.createElement("canvas");
  c.width = base.width; c.height = base.height;
  var g = c.getContext("2d");
  g.drawImage(base, 0, 0);
  var t = viewTransform([p.vx0, p.vy0, p.vx0 + p.pw, p.vy1], THUMB_W / p.pw, totalRot(p));
  g.setTransform(t[0], t[1], t[2], t[3], t[4], t[5]);
  p.annots.forEach(function(a){ drawAnnot(g, a); });
  var url = c.toDataURL("image/jpeg", 0.8);
  markedThumbs.set(p.uid, {sig: sig, url: url});
  return url;
}
/* 書き込みを変えたページのサムネイルを描き直す（一覧とページ整理の両方） */
var thumbTimers = new Map();
function refreshThumb(p){
  clearTimeout(thumbTimers.get(p.uid));
  thumbTimers.set(p.uid, setTimeout(function(){
    thumbTimers.delete(p.uid);
    thumbFor(p).then(function(url){
      var imgs = [thumbsEl.querySelector('.thumb[data-uid="' + p.uid + '"] .shot img'),
                  $("orgGrid").querySelector('.ocard[data-uid="' + p.uid + '"] .shot img')];
      imgs.forEach(function(img){ if (img && img.src !== url) img.src = url; });
    }).catch(function(){});
  }, 150));
}
function buildThumbs(){
  thumbsEl.textContent = "";
  S.pages.forEach(function(p, i){
    var el = document.createElement("div");
    el.className = "thumb"; el.dataset.uid = p.uid;
    el.setAttribute("role","option");
    el.setAttribute("aria-selected", S.sel.has(p.uid) ? "true" : "false");
    var shot = document.createElement("div"); shot.className = "shot empty";
    var no = document.createElement("div"); no.className = "no"; no.textContent = (i+1);
    el.appendChild(shot); el.appendChild(no);
    if (p.annots.length){ var m = document.createElement("i"); m.className="mark"; el.appendChild(m); }
    thumbsEl.appendChild(el);
    thumbFor(p).then(function(url){
      var img = new Image(); img.src = url; img.alt = ""; img.draggable = false;
      shot.className = "shot"; shot.textContent = ""; shot.appendChild(img);
    }).catch(function(){});

    el.addEventListener("click", function(ev){
      if (railDragJustEnded) return;         // 並べ替えの直後は選択しない
      selectPage(p.uid, ev.shiftKey, ev.ctrlKey || ev.metaKey);
      if (p.el) p.el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  updateSelUI();
}
/* ページの並べ替え。タッチでも動くようポインタ操作で実装する。
   マウス・ペンは動かした時点で、指は長押ししてから掴む（指はスクロールにも使うため）。 */
var railDragJustEnded = false;
var rail = null;   // {uid, el, x, y, id, active, at, timer}

function railThumbs(){ return Array.prototype.slice.call(thumbsEl.children); }
function railClearMarks(){
  railThumbs().forEach(function(x){ x.classList.remove("dropbefore","dropafter"); });
}
function railTargetIndex(y){
  var els = railThumbs();
  for (var i=0;i<els.length;i++){
    var r = els[i].getBoundingClientRect();
    if (y < r.top + r.height/2) return i;
  }
  return els.length;
}
function railBegin(){
  if (!rail || rail.active) return;
  rail.active = true;
  rail.el.classList.add("grabbed");
  thumbsEl.classList.add("reordering");
}
function railEnd(){
  if (!rail) return;
  clearTimeout(rail.timer);
  var r = rail; rail = null;
  thumbsEl.classList.remove("reordering");
  r.el.classList.remove("grabbed");
  railClearMarks();
  if (!r.active) return;
  railDragJustEnded = true;
  setTimeout(function(){ railDragJustEnded = false; }, 0);
  if (r.at == null) return;
  var from = S.pages.findIndex(function(p){ return p.uid === r.uid; });
  var to = r.at > from ? r.at - 1 : r.at;      // 自分を抜いた後の位置に直す
  if (from >= 0 && to !== from) movePageTo(r.uid, to);
}

thumbsEl.addEventListener("pointerdown", function(e){
  var el = e.target.closest(".thumb");
  if (!el || (e.button != null && e.button !== 0)) return;
  rail = {uid:+el.dataset.uid, el:el, x:e.clientX, y:e.clientY, id:e.pointerId,
          active:false, at:null, timer:null};
  if (e.pointerType === "touch") rail.timer = setTimeout(railBegin, 350);
});
thumbsEl.addEventListener("pointermove", function(e){
  if (!rail || e.pointerId !== rail.id) return;
  var far = Math.abs(e.clientX - rail.x) + Math.abs(e.clientY - rail.y);
  if (!rail.active){
    if (e.pointerType === "touch"){
      if (far > 12){ clearTimeout(rail.timer); rail = null; }   // スクロールに譲る
      return;
    }
    if (far > 6) railBegin(); else return;
  }
  railClearMarks();
  rail.at = railTargetIndex(e.clientY);
  var els = railThumbs();
  if (rail.at < els.length) els[rail.at].classList.add("dropbefore");
  else if (els.length) els[els.length-1].classList.add("dropafter");
});
thumbsEl.addEventListener("pointerup", railEnd);
thumbsEl.addEventListener("pointercancel", railEnd);
/* 並べ替え中だけ、指でのスクロールを止める */
thumbsEl.addEventListener("touchmove", function(e){
  if (rail && rail.active) e.preventDefault();
}, {passive:false});

function markThumb(p){
  refreshThumb(p);
  var el = thumbsEl.querySelector('.thumb[data-uid="'+p.uid+'"]');
  if (!el) return;
  var has = el.querySelector(".mark");
  if (p.annots.length && !has){ var m=document.createElement("i"); m.className="mark"; el.appendChild(m); }
  if (!p.annots.length && has) has.remove();
}
function selectPage(uid, shift, toggle, silent){
  if (toggle){ if (S.sel.has(uid)) S.sel.delete(uid); else S.sel.add(uid); }
  else if (shift && S.sel.size){
    var idx = S.pages.findIndex(function(p){return p.uid===uid;});
    var last = S.pages.findIndex(function(p){return p.uid===Array.from(S.sel).pop();});
    var a = Math.min(idx,last), b = Math.max(idx,last);
    for (var i=a;i<=b;i++) S.sel.add(S.pages[i].uid);
  } else { S.sel = new Set([uid]); }
  updateSelUI();
}
function updateSelUI(){
  Array.from(thumbsEl.children).forEach(function(el){
    el.setAttribute("aria-selected", S.sel.has(+el.dataset.uid) ? "true" : "false");
  });
  var n = S.sel.size;
  ["opRotL","opRotR","opUp","opDown","opDup","opDel"].forEach(function(id){ $(id).disabled = !n; });
  $("opBlank").disabled = !S.pages.length;
  if (inOrganize()) syncOrgBar();
}

/* --------------------------------------------------------------- page ops */
function selectedPages(){ return S.pages.filter(function(p){ return S.sel.has(p.uid); }); }
function rotateSel(dir){
  if (!S.sel.size) return;
  pushHistory();
  selectedPages().forEach(function(p){ p.rot = ((p.rot + dir*90) % 360 + 360) % 360; });
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}
function deleteSel(){
  if (!S.sel.size) return;
  pushHistory();
  S.pages = S.pages.filter(function(p){ return !S.sel.has(p.uid); });
  S.sel = new Set(); S.active = null;
  pruneDocs();
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}
function dupSel(){
  if (!S.sel.size) return;
  pushHistory();
  var out = [];
  S.pages.forEach(function(p){
    out.push(p);
    if (S.sel.has(p.uid)){
      var c = newPage(p.docId, p.srcIndex, p);
      c.rot = p.rot; c.blank = p.blank;
      c.annots = JSON.parse(JSON.stringify(p.annots));
      out.push(c);
    }
  });
  S.pages = out;
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}
function moveSel(dir){
  if (!S.sel.size) return;
  pushHistory();
  var idx = S.pages.map(function(p,i){ return S.sel.has(p.uid) ? i : -1; }).filter(function(i){return i>=0;});
  if (dir < 0){
    if (idx[0] === 0) { histPop(S.history); syncUndo(); return; }
    idx.forEach(function(i){ var t=S.pages[i-1]; S.pages[i-1]=S.pages[i]; S.pages[i]=t; });
  } else {
    if (idx[idx.length-1] === S.pages.length-1) { histPop(S.history); syncUndo(); return; }
    idx.slice().reverse().forEach(function(i){ var t=S.pages[i+1]; S.pages[i+1]=S.pages[i]; S.pages[i]=t; });
  }
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}
function movePageTo(uid, toIdx){
  var from = S.pages.findIndex(function(p){ return p.uid === uid; });
  if (from < 0 || from === toIdx) return;
  pushHistory();
  var p = S.pages.splice(from,1)[0];
  S.pages.splice(toIdx, 0, p);
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}
function addBlank(){
  var ref = selectedPages()[0] || S.pages[S.pages.length-1];
  var w = ref ? ref.pw : 595.28, h = ref ? ref.ph : 841.89;
  pushHistory();
  var np = newPage(null, -1, {pw:w, ph:h, vx0:0, vy0:0, vy1:h, irot:0, blank:true});
  var at = ref ? S.pages.indexOf(ref)+1 : S.pages.length;
  S.pages.splice(at, 0, np);
  S.sel = new Set([np.uid]);
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}

/* ------------------------------------------------------------------ zoom */
function setZoom(z, keepFit){
  if (!keepFit) S.fitWidth = false;
  S.zoom = clamp(z, 0.25, 4);
  $("zLabel").textContent = Math.round(S.zoom*100) + "%";
  buildSheets();
}
function fitWidth(){
  if (!S.pages.length) return;
  var avail = stage.clientWidth - 44;
  var p = S.pages[0], r = totalRot(p);
  var base = (r % 180 === 0) ? p.pw : p.ph;
  setZoom(avail / base, true);
  S.fitWidth = true;
}

/* ---------------------------------------------------------------- export */
/* 白塗り(墨消し)を含むページは、元のテキストを確実に消すためページごと画像化する。
   元のページオブジェクトを一切コピーしないので、隠れたテキストは出力に残らない。 */
var REDACT_DPI = 200;
function hasRedaction(p){
  return !!(p.annots && p.annots.some(function(a){ return a.t === "white"; }));
}
async function flattenPage(out, p){
  var scale = REDACT_DPI / 72;
  var d = dispSize(p, 1);                       // 回転を反映したページ寸法(pt)
  var c = document.createElement("canvas");
  c.width  = Math.max(1, Math.round(d.w * scale));
  c.height = Math.max(1, Math.round(d.h * scale));
  var ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);

  var page = await getPdfPage(p);
  var vp = page.getViewport({scale: scale, rotation: totalRot(p)});
  await page.render({canvasContext: ctx, viewport: vp}).promise;

  var m = vp.transform;                         // PDF座標 -> キャンバス画素
  ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
  p.annots.forEach(function(a){ drawAnnot(ctx, a); });
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  var blob = await new Promise(function(r){ c.toBlob(r, "image/jpeg", 0.92); });
  var img = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
  var target = out.addPage([d.w, d.h]);         // 回転は画像に焼き込み済み
  target.drawImage(img, {x: 0, y: 0, width: d.w, height: d.h});
  return target;
}

/* 元のページをそのままコピーできるか調べる。パスワード付きPDFは pdf-lib が
   復号できず、読み込みは通ってもページのコピーで失敗する。使い捨ての文書に
   1ページ写してみて確かめ、駄目なら画像として書き出す。 */
async function loadSource(srcCache, docId){
  if (!srcCache.has(docId)){
    var loaded = null;
    try {
      loaded = await PDFLib.PDFDocument.load(S.docs.get(docId).bytes,
                                             {ignoreEncryption:true, updateMetadata:false});
      var probe = await PDFLib.PDFDocument.create();
      await probe.copyPages(loaded, [0]);
    } catch(e){ loaded = null; }
    srcCache.set(docId, loaded);
  }
  return srcCache.get(docId);
}

/* しおり（目次）を引き継ぐ。ページを組み直すと元のしおりは写らないので、
   pdf.js でしおりを読み、行き先を書き出し後のページに付け替えて作り直す。
   削除したページを指すしおりは落とす（子に生き残りがあれば見出しとして残す）。
   複数のPDFを結合したときは、最初に出てくる順に並べる。 */
async function copyOutlines(out, list, flatAt){
  var L = PDFLib, ctx = out.context, pages = out.getPages();
  var where = new Map();                       // "docId:元のページ番号" -> 出力のページ番号
  var order = [];
  list.forEach(function(p, i){
    if (p.blank) return;
    var k = p.docId + ":" + p.srcIndex;
    if (!where.has(k)) where.set(k, i);
    if (order.indexOf(p.docId) < 0) order.push(p.docId);
  });

  async function resolve(pdf, dest){
    try {
      if (typeof dest === "string") dest = await pdf.getDestination(dest);
      if (!Array.isArray(dest) || !dest.length) return null;
      var ref = dest[0];
      var idx = (typeof ref === "number") ? ref : await pdf.getPageIndex(ref);
      return {idx: idx, dest: dest};
    } catch(e){ return null; }
  }
  async function collect(docId, pdf, items){
    var got = [];
    for (var i=0;i<items.length;i++){
      var it = items[i];
      var kids = (it.items && it.items.length) ? await collect(docId, pdf, it.items) : [];
      var r = it.dest ? await resolve(pdf, it.dest) : null;
      var at = r ? where.get(docId + ":" + r.idx) : undefined;
      if (at === undefined && !kids.length) continue;
      got.push({title: it.title || "", at: at, dest: r ? r.dest : null,
                closed: (it.count || 0) < 0, kids: kids});
    }
    return got;
  }

  var roots = [];
  for (var d=0; d<order.length; d++){
    var rec = S.docs.get(order[d]);
    if (!rec || !rec.pdf) continue;
    var ol = null;
    try { ol = await rec.pdf.getOutline(); } catch(e){ ol = null; }
    if (ol && ol.length) roots = roots.concat(await collect(order[d], rec.pdf, ol));
  }
  if (!roots.length) return 0;

  function destFor(n){
    var pageRef = pages[n.at].ref;
    // 画像にしたページは座標系が変わるので、ページ全体を表示させる
    if (flatAt.has(n.at) || !n.dest) return ctx.obj([pageRef, L.PDFName.of("Fit")]);
    var kind = (n.dest[1] && n.dest[1].name) ? n.dest[1].name : "Fit";
    var rest = n.dest.slice(2).map(function(v){ return (typeof v === "number") ? v : null; });
    return ctx.obj([pageRef, L.PDFName.of(kind)].concat(rest));
  }
  var total = 0;
  function emit(nodes, parentRef){
    var refs = nodes.map(function(){ return ctx.nextRef(); });
    var visible = 0;
    nodes.forEach(function(n, i){
      var dict = {Title: L.PDFHexString.fromText(n.title), Parent: parentRef};
      if (i > 0) dict.Prev = refs[i - 1];
      if (i < nodes.length - 1) dict.Next = refs[i + 1];
      if (n.at !== undefined) dict.Dest = destFor(n);
      total++;
      visible++;
      if (n.kids.length){
        var sub = emit(n.kids, refs[i]);
        dict.First = sub.first; dict.Last = sub.last;
        dict.Count = n.closed ? -sub.visible : sub.visible;
        if (!n.closed) visible += sub.visible;
      }
      ctx.assign(refs[i], ctx.obj(dict));
    });
    return {first: refs[0], last: refs[refs.length - 1], visible: visible};
  }
  var rootRef = ctx.nextRef();
  var top = emit(roots, rootRef);
  ctx.assign(rootRef, ctx.obj({Type: L.PDFName.of("Outlines"), First: top.first, Last: top.last, Count: top.visible}));
  out.catalog.set(L.PDFName.of("Outlines"), rootRef);
  return total;
}

/* 入力フォームを引き継ぐ。copyPages はページ上の入力欄（ウィジェット）は
   写すが、文書全体の /AcroForm（どれが入力欄かの一覧）は写さない。そのまま
   では入力欄として認識されず、受け取った人が書き込めなくなっていた。
   書き出したページ上のウィジェットから親をたどって、入力欄の一覧を作り直す。 */
function rebuildAcroForm(out, list, srcCache){
  var L = PDFLib, N = L.PDFName, ctx = out.context;
  var roots = [], seen = new Set();
  out.getPages().forEach(function(pg){
    var annots = pg.node.lookup(N.of("Annots"));
    if (!(annots instanceof L.PDFArray)) return;
    for (var i=0;i<annots.size();i++){
      var ref = annots.get(i);
      if (!(ref instanceof L.PDFRef)) continue;
      var a = ctx.lookup(ref);
      if (!(a instanceof L.PDFDict) || a.get(N.of("Subtype")) !== N.of("Widget")) continue;
      var r = ref, o = a, guard = 0;
      while (o.get(N.of("Parent")) instanceof L.PDFRef && guard++ < 32){
        r = o.get(N.of("Parent")); o = ctx.lookup(r);
      }
      if (!seen.has(r.toString())){ seen.add(r.toString()); roots.push({ref:r, dict:o}); }
    }
  });
  if (!roots.length) return 0;

  /* 同じ名前の入力欄が別々にあると、片方に書くともう片方も変わったり、
     片方しか認識されなかったりする。ページの複製や同じ様式の結合で起きる
     ので、後に出てくるほうに番号を付けて独立させる。 */
  var used = new Set();
  roots.forEach(function(rt){
    var t = rt.dict.get(N.of("T"));
    var name = (t && t.decodeText) ? t.decodeText() : "";
    if (!name) return;
    if (!used.has(name)){ used.add(name); return; }
    var n = 2;
    while (used.has(name + "_" + n)) n++;
    used.add(name + "_" + n);
    rt.dict.set(N.of("T"), L.PDFHexString.fromText(name + "_" + n));
  });

  var af = ctx.obj({Fields: roots.map(function(rt){ return rt.ref; })});
  /* 入力欄の既定の書体や大きさ（/DA /DR）は元の様式から写す。これが無いと、
     入力し直したときに文字が出ない閲覧ソフトがある。 */
  var docs = [];
  list.forEach(function(p){ if (!p.blank && docs.indexOf(p.docId) < 0) docs.push(p.docId); });
  for (var i=0;i<docs.length;i++){
    var src = srcCache.get(docs[i]);
    var saf = src && src.catalog.lookup(N.of("AcroForm"));
    if (!(saf instanceof L.PDFDict)) continue;
    var copier = L.PDFObjectCopier.for(src.context, ctx);
    ["DA", "DR", "Q", "NeedAppearances"].forEach(function(key){
      var v = saf.get(N.of(key));
      if (v !== undefined) af.set(N.of(key), copier.copy(v));
    });
    break;
  }
  out.catalog.set(N.of("AcroForm"), ctx.register(af));
  return roots.length;
}

function srcHasAnnots(src, index){
  try {
    var a = src.getPage(index).node.lookup(PDFLib.PDFName.of("Annots"));
    return !!(a && a.size && a.size() > 0);
  } catch(e){ return true; }   // 分からなければ安全側（個別にコピー）
}

async function buildPdf(list, onProgress){
  var PDFDocument = PDFLib.PDFDocument, degrees = PDFLib.degrees;
  var out = await PDFDocument.create();
  var srcCache = new Map(), stamps = new Map();
  var mctx = document.createElement("canvas").getContext("2d");  // 文字幅の計測用
  var redacted = 0, locked = 0;

  /* まず、各ページをどう出すかを決める。
     ページのコピーは文書ごとに1回にまとめる。1ページずつ写すと、複数の
     ページが共有している画像やフォントがページ数だけ複製され、スキャンした
     PDFで出力が何十倍にも膨らむ。 */
  var plan = [], need = new Map(), firstSeen = new Set();
  for (var i=0;i<list.length;i++){
    var p = list[i];
    var src = p.blank ? null : await loadSource(srcCache, p.docId);
    if (!p.blank && (hasRedaction(p) || !src)){
      plan.push({p:p, how:"flat"});
      if (!src) locked++; else redacted++;
    } else if (p.blank){
      plan.push({p:p, how:"blank"});
    } else if (firstSeen.has(p.docId + ":" + p.srcIndex) && srcHasAnnots(src, p.srcIndex)){
      /* 同じ元ページの2枚目以降（複製）は、まとめてコピーすると1枚目と
         入力欄やリンクの実体を共有してしまう。1つの注釈が2ページに属する
         不正な形になるので、注釈のあるページだけは個別にコピーして独立させる。
         注釈の無いページはまとめてコピーしても問題なく、画像も共有できる。 */
      plan.push({p:p, how:"own", docId:p.docId});
    } else {
      firstSeen.add(p.docId + ":" + p.srcIndex);
      if (!need.has(p.docId)) need.set(p.docId, []);
      var q = need.get(p.docId);
      plan.push({p:p, how:"copy", docId:p.docId, slot:q.length});
      q.push(p.srcIndex);
    }
  }
  var copies = new Map();
  var docIds = Array.from(need.keys());
  for (var d=0; d<docIds.length; d++){
    var id = docIds[d];
    copies.set(id, await out.copyPages(srcCache.get(id), need.get(id)));
  }

  for (var k=0;k<plan.length;k++){
    var it = plan[k], pg = it.p, target;
    if (onProgress) onProgress(k, plan.length);
    if (it.how === "flat"){
      await flattenPage(out, pg);
      await new Promise(function(r){ setTimeout(r, 0); });
      continue;
    }
    if (it.how === "blank"){
      target = out.addPage([pg.pw, pg.ph]);
      if (pg.rot) target.setRotation(degrees(((pg.rot % 360) + 360) % 360));
    } else {
      target = (it.how === "own")
        ? (await out.copyPages(srcCache.get(it.docId), [pg.srcIndex]))[0]
        : copies.get(it.docId)[it.slot];
      out.addPage(target);
      var cur = 0;
      try { cur = target.getRotation().angle || 0; } catch(e){ cur = 0; }
      target.setRotation(degrees((((cur + pg.rot) % 360) + 360) % 360));
    }
    if (pg.annots && pg.annots.length) await drawAnnots(out, target, pg, mctx, stamps);
    await new Promise(function(r){ setTimeout(r, 0); });
  }
  var flatAt = new Set();
  plan.forEach(function(it, i){ if (it.how === "flat") flatAt.add(i); });
  try { await copyOutlines(out, list, flatAt); } catch(e){ console.warn("しおりを引き継げませんでした", e); }
  try { rebuildAcroForm(out, list, srcCache); } catch(e){ console.warn("入力フォームを引き継げませんでした", e); }
  out.setProducer("PDF工房");
  return {bytes: await out.save({useObjectStreams:false}), redacted: redacted, locked: locked};
}
/* 注釈はできるかぎりベクターとして書き出す。ページ全体を画像化しないので、
   元の文字は選択・検索できるまま、書き込みも拡大してぼやけない。 */
var RASTER_DPI = 300;   // ベクター化できない注釈(テキスト)だけに使う

function pdfColor(hex){
  var h = String(hex || "#000000").replace("#","");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  return PDFLib.rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255);
}
function strokePath(pts){
  // 画面と同じ2次ベジエでなぞる。drawSvgPath は y 軸が逆向きなので符号を反転する
  var d = "M " + pts[0][0] + " " + (-pts[0][1]);
  for (var i=1;i<pts.length-1;i++){
    var mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
    d += " Q " + pts[i][0] + " " + (-pts[i][1]) + " " + mx + " " + (-my);
  }
  var last = pts[pts.length-1];
  return d + " L " + last[0] + " " + (-last[1]);
}
function dataUrlBytes(url){
  var bin = atob(url.slice(url.indexOf(",") + 1));
  var out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function embedStamp(out, rec){
  if (/^data:image\/png/i.test(rec.url))   return await out.embedPng(dataUrlBytes(rec.url));
  if (/^data:image\/jpe?g/i.test(rec.url)) return await out.embedJpg(dataUrlBytes(rec.url));
  // webp など pdf-lib が直接埋め込めない形式は PNG に変換する
  var c = document.createElement("canvas");
  c.width = rec.el.naturalWidth; c.height = rec.el.naturalHeight;
  c.getContext("2d").drawImage(rec.el, 0, 0);
  var blob = await new Promise(function(r){ c.toBlob(r, "image/png"); });
  return await out.embedPng(new Uint8Array(await blob.arrayBuffer()));
}
/* 日本語フォントを同梱していないため、テキストだけは画像にする。
   ページ全体ではなく、その注釈の範囲だけを高解像度で焼く。 */
async function rasterAnnot(out, target, a, mctx){
  var b = bbox(mctx, a), pad = 2;
  var x0 = b.x - pad, y0 = b.y - pad, w = b.w + pad*2, h = b.h + pad*2;
  if (!(w > 0) || !(h > 0)) return;
  var s = RASTER_DPI / 72;
  var c = document.createElement("canvas");
  c.width  = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  var g = c.getContext("2d");
  g.setTransform(s, 0, 0, -s, -x0*s, (y0+h)*s);
  drawAnnot(g, a);
  var blob = await new Promise(function(r){ c.toBlob(r, "image/png"); });
  var img = await out.embedPng(new Uint8Array(await blob.arrayBuffer()));
  target.drawImage(img, {x:x0, y:y0, width:w, height:h});
}

async function drawAnnots(out, target, p, mctx, stamps){
  for (var i=0;i<p.annots.length;i++){
    var a = p.annots[i];
    if (a.t === "pen" || a.t === "marker"){
      var op = (a.t === "marker") ? 0.38 : 1;
      if (a.p.length === 1){
        target.drawCircle({x:a.p[0][0], y:a.p[0][1], size:a.w/2, color:pdfColor(a.c), opacity:op});
      } else {
        target.drawSvgPath(strokePath(a.p), {
          x:0, y:0,
          borderColor: pdfColor(a.c), borderWidth: a.w, borderOpacity: op,
          borderLineCap: (a.t === "marker") ? LineCapStyle.Butt : LineCapStyle.Round
        });
      }
    } else if (a.t === "rect"){
      target.drawRectangle({x:a.x, y:a.y, width:a.w2, height:a.h2,
        borderColor: pdfColor(a.c), borderWidth: a.w});
    } else if (a.t === "white"){
      target.drawRectangle({x:a.x, y:a.y, width:a.w2, height:a.h2, color: pdfColor(a.c || "#ffffff")});
    } else if (a.t === "line"){
      target.drawLine({start:{x:a.x, y:a.y}, end:{x:a.x + a.w2, y:a.y + a.h2},
        thickness: a.w, color: pdfColor(a.c), lineCap: LineCapStyle.Round});
    } else if (a.t === "image"){
      var rec = S.images.get(a.img);
      if (rec){
        if (!stamps.has(a.img)) stamps.set(a.img, await embedStamp(out, rec));
        target.drawImage(stamps.get(a.img), {x:a.x, y:a.y, width:a.w2, height:a.h2});
      }
    } else if (a.t === "text"){
      await rasterAnnot(out, target, a, mctx);
    }
  }
}
/* 書き出し名のもとにする、いま開いているPDFの名前 */
function sourceName(){
  for (var i=0;i<S.pages.length;i++){
    var rec = S.docs.get(S.pages[i].docId);
    if (rec) return rec.name;
  }
  return "document.pdf";
}

/* ファイル名と範囲を決めてから書き出す */
function askExport(preferSel){
  if (!S.pages.length){ toast("書き出すページがありません"); return; }
  var base = sourceName().replace(/\.pdf$/i, "");
  var n = S.sel.size, total = S.pages.length;
  var canSel = n > 0 && n < total;
  modal(
    '<div class="card" role="dialog" aria-modal="true" aria-labelledby="exttl">' +
      '<div class="ttl" id="exttl">PDFを書き出す</div>' +
      '<div class="msg">ファイル名と範囲を選んでください。</div>' +
      '<div class="fname"><input type="text" aria-label="ファイル名"><span>.pdf</span></div>' +
      '<label class="pick"><input type="radio" name="rg" value="all"' + ((canSel && preferSel) ? '' : ' checked') + '>' +
        'すべてのページ（' + total + 'ページ）</label>' +
      '<label class="pick' + (canSel ? '' : ' off') + '">' +
        '<input type="radio" name="rg" value="sel"' + (canSel ? ((preferSel) ? ' checked' : '') : ' disabled') + '>' +
        (canSel ? '選択した' + n + 'ページだけ' : '選択したページだけ（ページ一覧で選ぶと使えます）') + '</label>' +
      '<div class="row">' +
        '<button class="btn ghost" data-a="cancel">キャンセル</button>' +
        '<button class="btn primary" data-a="ok">書き出す</button>' +
      '</div>' +
    '</div>',
    function(back, finish){
      var input = back.querySelector('input[type="text"]');
      input.value = base + ((canSel && preferSel) ? "_抜粋" : "_編集");
      function go(){
        var name = (input.value || base).trim().replace(/[\\/:*?"<>|]/g, "_");
        var sel = back.querySelector('input[value="sel"]').checked;
        finish(null);
        exportPdf(sel, name + ".pdf");
      }
      back.querySelectorAll('input[name="rg"]').forEach(function(r){
        r.addEventListener("change", function(){
          if (input.value === base + "_編集" || input.value === base + "_抜粋")
            input.value = base + (r.value === "sel" ? "_抜粋" : "_編集");
        });
      });
      back.addEventListener("click", function(e){
        var a = e.target.closest("[data-a]");
        if (!a) return;
        if (a.dataset.a === "ok") go(); else finish(null);
      });
      back.addEventListener("keydown", function(e){
        e.stopPropagation();
        if (e.key === "Enter"){ e.preventDefault(); go(); }
        if (e.key === "Escape"){ e.preventDefault(); finish(null); }
      });
      input.focus(); input.select();
    }
  );
}

async function exportPdf(onlySelected, fileName){
  var list = onlySelected ? selectedPages() : S.pages;
  if (!list.length){ toast("書き出すページがありません"); return; }
  busy("PDFを作成しています…");
  try{
    var built = await buildPdf(list, function(i,n){ busy("PDFを作成しています… " + (i+1) + " / " + n); });
    var name = fileName;
    if (!name){
      name = sourceName().replace(/\.pdf$/i, "") + (onlySelected ? "_抜粋" : "_編集") + ".pdf";
    }
    var blob = new Blob([built.bytes], {type:"application/pdf"});
    busy(null);
    await saveFile(name, blob);
    setTimeout(function(){
      if (built.locked)
        toast("パスワード付きPDFの" + built.locked + "ページは、そのままコピーできないため画像にしました", 4600);
      else if (built.redacted)
        toast("白塗りした" + built.redacted + "ページは、文字データごと消すため画像にしました", 4200);
    }, 2000);
  }catch(err){
    console.error(err); busy(null);
    toast("書き出しに失敗しました: " + (err && err.message ? err.message : err));
  }
}
async function saveFile(name, blob){
  var dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){ dl = null; }
  if (dl){
    try{
      await dl.save({filename: name, data: blob});
      toast("「" + name + "」を保存しました");
    }catch(err){
      if (err && err.code === "declined") toast("保存をキャンセルしました");
      else toast("保存できませんでした（" + ((err && err.code) || "不明") + "）");
    }
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("「" + name + "」を書き出しました");
}

/* ---------------------------------------------------------------- 印刷
   ブラウザの印刷にそのまま任せると、アプリの画面が刷られてしまう。
   書き出しと同じPDFを作り、各ページを画像にして印刷専用の欄に並べてから刷る。
   紙の大きさと向きはページごとに @page で指定する（PDFビューアの「実際のサイズ」と同じ）。 */
var PRINT_DPI = 150;
var printing = false;
function askPrint(){
  if (!S.pages.length){ toast("印刷するページがありません"); return; }
  var n = S.sel.size, total = S.pages.length;
  if (!(n > 0 && n < total)){ printPdf(false); return; }
  modal(
    '<div class="card" role="dialog" aria-modal="true" aria-labelledby="prttl">' +
      '<div class="ttl" id="prttl">印刷</div>' +
      '<div class="msg">印刷する範囲を選んでください。</div>' +
      '<label class="pick"><input type="radio" name="rg" value="all" checked>すべてのページ（' + total + 'ページ）</label>' +
      '<label class="pick"><input type="radio" name="rg" value="sel">選択した' + n + 'ページだけ</label>' +
      '<div class="row">' +
        '<button class="btn ghost" data-a="cancel">キャンセル</button>' +
        '<button class="btn primary" data-a="ok">印刷する</button>' +
      '</div>' +
    '</div>',
    function(back, finish){
      function go(){
        var sel = back.querySelector('input[value="sel"]').checked;
        finish(null);
        printPdf(sel);
      }
      back.addEventListener("click", function(e){
        var a = e.target.closest("[data-a]");
        if (!a) return;
        if (a.dataset.a === "ok") go(); else finish(null);
      });
      back.addEventListener("keydown", function(e){
        e.stopPropagation();
        if (e.key === "Enter"){ e.preventDefault(); go(); }
        if (e.key === "Escape"){ e.preventDefault(); finish(null); }
      });
      back.querySelector('button[data-a="ok"]').focus();
    }
  );
}
function clearPrint(){
  var area = $("printArea");
  area.querySelectorAll("img").forEach(function(im){ URL.revokeObjectURL(im.src); });
  area.innerHTML = "";
  var st = $("printStyle"); if (st) st.remove();
  document.body.classList.remove("printing");
}
async function printPdf(onlySelected){
  if (printing) return;
  var list = onlySelected ? selectedPages() : S.pages;
  if (!list.length){ toast("印刷するページがありません"); return; }
  printing = true;
  clearPrint();
  var doc = null;
  busy("印刷の準備をしています…");
  try{
    var n = list.length;
    var built = await buildPdf(list, function(i){ busy("印刷の準備をしています… " + (i+1) + " / " + (n*2)); });
    doc = await pdfjsLib.getDocument({data: built.bytes, isEvalSupported:false}).promise;
    var area = $("printArea"), sizes = {}, css = "", canvas = document.createElement("canvas");
    // 巨大なページで端末のメモリが尽きないよう、1ページの画素数に上限を設ける
    var MAXPX = 16e6;
    for (var i = 0; i < doc.numPages; i++){
      busy("印刷の準備をしています… " + (n + i + 1) + " / " + (n*2));
      var pg = await doc.getPage(i + 1);
      var vp1 = pg.getViewport({scale:1});
      var sc = PRINT_DPI / 72;
      if (vp1.width * vp1.height * sc * sc > MAXPX) sc = Math.sqrt(MAXPX / (vp1.width * vp1.height));
      var vp = pg.getViewport({scale:sc});
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      var cx = canvas.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, canvas.width, canvas.height);
      await pg.render({canvasContext:cx, viewport:vp, intent:"print",
                       annotationMode:pdfjsLib.AnnotationMode.ENABLE_STORAGE}).promise;
      pg.cleanup();
      var blob = await new Promise(function(res){ canvas.toBlob(res, "image/jpeg", 0.92); });
      var w = Math.round(vp1.width * 100) / 100, h = Math.round(vp1.height * 100) / 100;
      var key = "pk" + String(w).replace(".", "_") + "x" + String(h).replace(".", "_");
      if (!sizes[key]){
        sizes[key] = 1;
        css += "@page " + key + "{size:" + w + "pt " + h + "pt;margin:0}\n";
      }
      var box = document.createElement("div");
      box.className = "pp";
      box.style.cssText = "page:" + key + ";width:" + w + "pt;height:" + h + "pt";
      var im = new Image();
      im.alt = "";
      im.src = URL.createObjectURL(blob);
      box.appendChild(im); area.appendChild(box);
      try { await im.decode(); } catch(e){}
    }
    canvas.width = canvas.height = 0;
    var first = area.querySelector(".pp");
    // 名前の無い @page（最初のページの大きさ）も決めておく。ページ名に対応しないブラウザ向け
    css += "@page{size:" + first.style.width + " " + first.style.height + ";margin:0}\n";
    var st = document.createElement("style");
    st.id = "printStyle"; st.textContent = "@media print{" + css + "}";
    document.head.appendChild(st);
    busy(null);
    document.body.classList.add("printing");
    var done = false;
    var after = function(){
      if (done) return;
      done = true;
      window.removeEventListener("afterprint", after);
      clearPrint();
    };
    window.addEventListener("afterprint", after);
    window.print();
    // print() が待たずに戻る端末（スマホなど）もあるため、片付けは afterprint に任せる。
    // afterprint が来ない端末でも、次に印刷するときに clearPrint() で片付く。
  }catch(err){
    console.error(err); busy(null); clearPrint();
    toast("印刷の準備に失敗しました: " + (err && err.message ? err.message : err));
  }finally{
    if (doc) doc.destroy();
    printing = false;
  }
}

/* -------------------------------------------------------------- image stamp */
function addImage(file){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      placeImage(img, fr.result, 180, "画像を置きました。ドラッグで移動、右下の角で拡大縮小できます");
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
/* いま見ているページの、見えている範囲の真ん中に画像を置く。
   回転したページでもまっすぐ見えるよう、画像そのものをページの向きに合わせて回しておく。 */
async function placeImage(img, url, maxW, msg){
  var p = S.pages[currentPageIndex()];
  if (!p){ toast("先にPDFを開いてください"); return null; }
  var rot = totalRot(p), el = img, ew = img.naturalWidth, eh = img.naturalHeight;
  if (rot){
    var c = document.createElement("canvas"), turn = rot % 180 !== 0;
    c.width = turn ? eh : ew; c.height = turn ? ew : eh;
    var g = c.getContext("2d");
    g.translate(c.width / 2, c.height / 2);
    g.rotate(-rot * Math.PI / 180);
    g.drawImage(img, -ew / 2, -eh / 2);
    url = /^data:image\/jpe?g/i.test(url) ? c.toDataURL("image/jpeg", 0.92) : c.toDataURL("image/png");
    el = new Image(); el.src = url;
    try { await el.decode(); } catch(e){}
    ew = c.width; eh = c.height;
  }
  var id = "i" + (++S.uid);
  S.images.set(id, {url: url, el: el});
  // 画面で見た幅を maxW（ページ幅の4割まで）にする。PDF座標の w2 が画面の縦になることもある
  var sw = Math.min(maxW, (rot % 180 ? p.ph : p.pw) * 0.4), bw, bh;
  if (rot % 180){ bh = sw; bw = bh * ew / eh; } else { bw = sw; bh = bw * eh / ew; }
  var cxy = viewCenter(p);
  pushHistory();
  var a = {id:++S.uid, t:"image", img:id,
           x: clamp(cxy[0] - bw/2, p.vx0, p.vx0 + p.pw - bw),
           y: clamp(cxy[1] - bh/2, p.vy0, p.vy1 - bh), w2:bw, h2:bh};
  p.annots.push(a);
  S.active = {p:p, a:a};
  setTool("select");
  if (!p.rendered) renderSheet(p); else paintSheet(p);
  markThumb(p);
  if (msg) toast(msg);
  return a;
}
/* ページの、画面に見えている部分の真ん中（PDF座標）。見えていなければページの真ん中 */
function viewCenter(p){
  var mid = [p.vx0 + p.pw / 2, (p.vy0 + p.vy1) / 2];
  if (!p.el) return mid;
  var r = p.el.querySelector(".anc").getBoundingClientRect(), sr = stage.getBoundingClientRect();
  var x0 = Math.max(r.left, sr.left), x1 = Math.min(r.right, sr.right);
  var y0 = Math.max(r.top, sr.top), y1 = Math.min(r.bottom, sr.bottom);
  if (x1 - x0 < 40 || y1 - y0 < 40) return mid;
  return toPdf(p, (x0 + x1) / 2 - r.left, (y0 + y1) / 2 - r.top);
}

/* 選択と並べ替え */
var orgDrag = null;
function orgCards(){ return Array.from($("orgGrid").children).filter(function(el){ return el.dataset.uid; }); }
function orgClearMarks(){
  orgCards().forEach(function(el){ el.classList.remove("dropbefore","dropafter"); });
}
function orgTargetIndex(x, y){
  var els = orgCards();
  for (var i=0;i<els.length;i++){
    var r = els[i].getBoundingClientRect();
    if (y < r.bottom && x < r.left + r.width / 2) return i;
    if (y < r.top) return i;
  }
  return els.length;
}
$("orgGrid").addEventListener("pointerdown", function(e){
  var el = e.target.closest(".ocard");
  if (!el || e.target.closest(".hb, .insb")) return;
  if (e.button != null && e.button !== 0) return;
  orgDrag = {uid:+el.dataset.uid, el:el, x:e.clientX, y:e.clientY, id:e.pointerId, active:false, at:null};
});
$("orgGrid").addEventListener("pointermove", function(e){
  if (!orgDrag || e.pointerId !== orgDrag.id) return;
  if (!orgDrag.active){
    if (Math.abs(e.clientX - orgDrag.x) + Math.abs(e.clientY - orgDrag.y) < 7) return;
    orgDrag.active = true;
    orgDrag.el.classList.add("grabbed");
  }
  orgClearMarks();
  orgDrag.at = orgTargetIndex(e.clientX, e.clientY);
  var els = orgCards();
  if (orgDrag.at < els.length) els[orgDrag.at].classList.add("dropbefore");
  else if (els.length) els[els.length - 1].classList.add("dropafter");
});
function orgEnd(e){
  if (!orgDrag) return;
  var d = orgDrag; orgDrag = null;
  d.el.classList.remove("grabbed");
  orgClearMarks();
  if (!d.active){
    selectPage(d.uid, e && e.shiftKey, e && (e.ctrlKey || e.metaKey));
    syncOrgBar();
    return;
  }
  if (d.at == null) return;
  var from = S.pages.findIndex(function(p){ return p.uid === d.uid; });
  var to = d.at > from ? d.at - 1 : d.at;
  if (from >= 0 && to !== from){
    pushHistory();
    var p = S.pages.splice(from, 1)[0];
    S.pages.splice(to, 0, p);
    buildOrg();
  }
}
$("orgGrid").addEventListener("pointerup", orgEnd);
$("orgGrid").addEventListener("pointercancel", function(){ orgEnd(null); });
$("orgGrid").addEventListener("contextmenu", function(e){
  var el = e.target.closest(".ocard");
  if (!el) return;
  e.preventDefault();
  var p = byUid(+el.dataset.uid);
  if (p) pageMenu(p, e.clientX, e.clientY);
});
$("orgGrid").addEventListener("dblclick", function(e){
  var el = e.target.closest(".ocard");
  if (!el) return;
  var p = byUid(+el.dataset.uid);
  setMode("edit");
  if (p && p.el) setTimeout(function(){ p.el.scrollIntoView({block:"start"}); }, 30);
});
$("orgGrid").addEventListener("keydown", function(e){
  var el = e.target.closest(".ocard");
  if (!el) return;
  var cards = orgCards(), i = cards.indexOf(el);
  var cols = Math.max(1, Math.round($("orgGrid").clientWidth / (orgSize + 22)));
  var next = null;
  if (e.key === "ArrowRight") next = i + 1;
  else if (e.key === "ArrowLeft") next = i - 1;
  else if (e.key === "ArrowDown") next = i + cols;
  else if (e.key === "ArrowUp") next = i - cols;
  else if (e.key === "Enter" || e.key === " "){
    e.preventDefault();
    selectPage(+el.dataset.uid, e.shiftKey, e.ctrlKey || e.metaKey);
    syncOrgBar(); return;
  } else if (e.key === "Delete" || e.key === "Backspace"){
    e.preventDefault(); deleteSel(); return;
  } else return;
  e.preventDefault();
  if (next != null && cards[next]){
    cards[next].focus();
    selectPage(+cards[next].dataset.uid, e.shiftKey, false);
    syncOrgBar();
  }
});

$("btnHelp").addEventListener("click", showHelp);
$("btnSample").addEventListener("click", openSample);

/* ページ一覧のキーボード操作 */
thumbsEl.addEventListener("keydown", function(e){
  if (!S.pages.length) return;
  var cur = S.pages.findIndex(function(p){ return S.sel.has(p.uid); });
  if (cur < 0) cur = 0;
  var mod = e.ctrlKey || e.metaKey;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    var d = e.key === "ArrowDown" ? 1 : -1;
    if (mod){ moveSel(d); return; }
    var next = clamp(cur + d, 0, S.pages.length - 1);
    selectPage(S.pages[next].uid, e.shiftKey, false);
    var el = S.pages[next].el;
    if (el) el.scrollIntoView({block:"nearest"});
    var t = thumbsEl.children[next];
    if (t) t.scrollIntoView({block:"nearest"});
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); deleteSel(); }
});

// Ctrl+P は入力欄の中でも横取りする（ブラウザに任せるとアプリの画面が刷られる）。
// 入力欄は keydown を止めることがあるので、捕捉段階で受ける。
window.addEventListener("keydown", function(e){
  if (!((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "p")) return;
  e.preventDefault(); e.stopPropagation();
  if (!document.querySelector(".modal") && !$("busy")) askPrint();
}, true);
document.addEventListener("keydown", function(e){
  if (S.editing) return;
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (e.key === "?" || (e.key === "/" && e.shiftKey)){ e.preventDefault(); showHelp(); return; }
  if (!(e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"){
    e.preventDefault(); $("findIn").focus(); $("findIn").select(); return;
  }
  var mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "s"){ e.preventDefault(); askExport(); return; }
  if (mod && (e.key === "+" || e.key === "=" || e.key === ";")){ e.preventDefault(); if (!inOrganize() && S.pages.length) setZoom(S.zoom * 1.2); return; }
  if (mod && (e.key === "-" || e.key === "_")){ e.preventDefault(); if (!inOrganize() && S.pages.length) setZoom(S.zoom / 1.2); return; }
  if (mod && e.key === "0"){ e.preventDefault(); if (!inOrganize()) fitWidth(); return; }
  if (e.key === "Delete" || e.key === "Backspace"){
    if (S.active){
      e.preventDefault(); pushHistory();
      var p = S.active.p; p.annots.splice(p.annots.indexOf(S.active.a),1);
      S.active = null; killFloatbar(); paintSheet(p); markThumb(p);
    }
    return;
  }
  if (inOrganize()) return;
  var map = {v:"select", t:"text", p:"pen", m:"marker", r:"rect", l:"line", w:"white", e:"erase"};
  if (!mod && map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});

var rz;
window.addEventListener("resize", function(){
  clearTimeout(rz);

    // シートの大きさは倍率だけで決まるため、普段は組み直さなくてよい。

});

/* --------------------------------------------------------------------- init */
async function init(){
  if (!PDFLib || !pdfjsLib){
    sheets.innerHTML = '<div style="color:#fff;padding:40px;text-align:center">ライブラリを読み込めませんでした。ページを再読み込みしてください。</div>';
    return;
  }
  buildTools(); buildFonts(); buildSwatches(); refreshToolClass(); syncUndo();
  $("wLabel").textContent = S.width;
  try { await document.fonts.ready; } catch(e){}

  var st = null;
  try { st = await idbGet("state"); } catch(e){ st = null; }
  if (st && st.pages){
    if (await askRestore(st.at || Date.now())){
      try {
        busy("前回の続きを開いています…");
        await restoreSession(st);
        return;
      } catch(err){
        if (!(err && err.cancelled)) console.error(err);
        S.docs.clear(); S.pages = []; S.sel = new Set(); pageCache.clear();
        toast("前回の内容を開けませんでした");
      } finally { busy(null); }
    } else {
      await idbClear();
    }
  }

  // サンプルは毎回作らない。起動を軽くし、すぐ自分のPDFを開けるようにする。
  $("emptyStage").hidden = false;
  syncFindEnabled(); syncFind();
}

async function openSample(){
  S.noSave = true;
  try {
    busy("サンプルを準備しています…");
    await loadSample();
  } catch(err){
    console.error(err);
    toast("サンプルを開けませんでした");
    $("emptyStage").hidden = false;
  } finally { busy(null); S.noSave = false; }
}

/* 自動保存が間に合っていないときだけ、閉じる前に確認する */
window.addEventListener("beforeunload", function(e){
  if (!S.unsaved || !S.pages.length) return;
  e.preventDefault();
  e.returnValue = "";
});
init();
})();
