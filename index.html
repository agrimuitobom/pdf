<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ページの並べ替え・削除・回転から、白塗り＋テキストでの書き換え、ペン・マーカー・押印まで。ブラウザだけで完結するPDF編集ツール。">
<meta name="theme-color" content="#2f5d8f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131820" media="(prefers-color-scheme: dark)">
<title>PDF工房</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{color-scheme:light dark}
  html,body{height:100%}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
</head>
<body>
<style>
:root{
  --paper:#eef0f4;
  --surface:#ffffff;
  --surface-2:#e5e9f0;
  --line:#d2d8e2;
  --line-soft:#e3e8f0;
  --ink:#15202b;
  --ink-2:#5c6878;
  --ink-3:#8b96a5;
  --accent:#2f5d8f;
  --accent-ink:#ffffff;
  --accent-soft:#e2ecf7;
  --danger:#b1432c;
  --danger-soft:#f7e6e2;
  --deck:#7b8492;
  --shadow-sm:0 1px 2px rgba(21,32,43,.10);
  --shadow-md:0 2px 6px rgba(21,32,43,.10),0 12px 28px rgba(21,32,43,.10);
  --r:7px;
  --ui:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131820;
    --surface:#1b222c;
    --surface-2:#242d39;
    --line:#333e4c;
    --line-soft:#2a3441;
    --ink:#e7edf5;
    --ink-2:#9aa6b6;
    --ink-3:#74808f;
    --accent:#79a9db;
    --accent-ink:#0f1620;
    --accent-soft:#20303f;
    --danger:#e0785e;
    --danger-soft:#33221d;
    --deck:#0c1016;
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow-md:0 2px 6px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#131820;
  --surface:#1b222c;
  --surface-2:#242d39;
  --line:#333e4c;
  --line-soft:#2a3441;
  --ink:#e7edf5;
  --ink-2:#9aa6b6;
  --ink-3:#74808f;
  --accent:#79a9db;
  --accent-ink:#0f1620;
  --accent-soft:#20303f;
  --danger:#e0785e;
  --danger-soft:#33221d;
  --deck:#0c1016;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 2px 6px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:13px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- header ---------- */
.appbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-size:15px;font-weight:700;letter-spacing:.06em}
.brand span{font-size:10.5px;color:var(--ink-3);letter-spacing:.14em}
.spacer{flex:1 1 auto}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);cursor:pointer;white-space:nowrap;
  box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn:disabled:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:6px}
.btn svg{display:block;width:16px;height:16px;flex:none}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
.tools{display:flex;gap:2px;flex-wrap:wrap}
.tool{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 9px;border:1px solid transparent;border-radius:var(--r);
  background:transparent;cursor:pointer;color:var(--ink-2);
}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink);font-weight:500}
.tool svg{width:17px;height:17px;display:block}
.tool .lb{font-size:12px}
.sep{width:1px;align-self:stretch;background:var(--line-soft);margin:2px 0}

.props{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink-2)}
.field{display:flex;align-items:center;gap:6px}
.field>label{font-size:11px;letter-spacing:.04em;color:var(--ink-3)}
.swatches{display:flex;gap:4px}
.sw{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--surface)}
.sw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 2px var(--accent)}
input[type=range]{width:88px;accent-color:var(--accent)}
select,input[type=number]{
  font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);
  border-radius:5px;background:var(--surface);color:var(--ink);
}
.hint{font-size:11.5px;color:var(--ink-3)}

/* ---------- main ---------- */
.main{display:flex;flex:1 1 auto;min-height:0}

.rail{
  width:186px;flex:none;display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--line);min-height:0;
}
.rail-head{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--line-soft);
}
.rail-head .ttl{font-size:11px;letter-spacing:.12em;color:var(--ink-3);flex:1}
.pageops{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.pageops .btn{padding:5px;box-shadow:none;border-color:transparent;background:transparent}
.pageops .btn:hover{background:var(--surface-2)}
.pageops .btn .lb{display:none}
.thumbs{flex:1 1 auto;overflow-y:auto;padding:10px 8px 24px;display:flex;flex-direction:column;gap:9px}

.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none}
.thumb .shot{
  width:110px;box-sizing:border-box;
  background:var(--surface);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow-sm);overflow:hidden;display:block;
}
.thumb .shot img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
.thumb .shot.empty{width:110px;height:150px;background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.thumb .no{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.thumb[aria-selected="true"] .shot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb[aria-selected="true"] .no{color:var(--accent);font-weight:700}
.thumb.dropbefore::before,.thumb.dropafter::after{
  content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--accent);border-radius:2px;
}
.thumb.dropbefore::before{top:-5px}
.thumb.dropafter::after{bottom:-5px}
.thumb.grabbed{opacity:.45}
.thumbs:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.modal .card.wide{width:min(560px,calc(100vw - 32px));max-height:80vh;overflow:auto}
.modal table{border-collapse:collapse;width:100%;font-size:12.5px;margin:2px 0 10px}
.modal table th{text-align:left;color:var(--ink-2);font-weight:500;padding:3px 8px 3px 0;white-space:nowrap;vertical-align:top}
.modal table td{padding:3px 0;color:var(--ink)}
.modal h4{font-size:12.5px;margin:14px 0 4px;color:var(--ink-2)}
.modal .card.wide a{color:var(--accent)}
#findBox input{
  font:inherit;font-size:12.5px;width:120px;padding:3px 6px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);
}
#findBox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#pjump{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
#pjump input{
  font:inherit;font-size:11px;width:34px;text-align:center;padding:2px 3px;
  border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
@media (max-width:900px){ #findBox input{width:84px} #findBox .hint{display:none} }

/* 上の帯は1行に収める。幅が足りなくなるにつれ、説明文 → ボタンの文字 → 検索欄の順にたたむ */
.appbar{position:relative}
.find-toggle,#zFit .fit-ic{display:none}
@media (max-width:1439px){
  .brand span{display:none}
  .appbar{gap:8px}
}
@media (max-width:1339px){
  .appbar #btnOpen .lb,.appbar #btnAdd .lb,.appbar #zFit .lb{display:none}
  .appbar #btnOpen,.appbar #btnAdd,.appbar #zFit{padding:6px 8px}
  #zFit .fit-ic{display:block}
}
@media (max-width:1179px){
  .find-toggle{display:inline-flex}
  .appbar #findBox{display:none}
  .appbar #findBox.open-narrow{
    display:flex;position:absolute;left:auto;right:14px;width:360px;
    top:calc(100% - 2px);z-index:20;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:5px 8px;box-shadow:var(--shadow-md);
  }
  .appbar #findBox.open-narrow input{flex:1 1 auto;width:auto}
  .appbar #findBox.open-narrow .hint{display:inline}
}
@media (max-width:899px){
  .appbar{gap:6px;padding-left:10px;padding-right:10px}
  .appbar .sep,.lb-pre{display:none}
}
@media (max-width:819px){ .appbar .brand{display:none} }
.thumbs.reordering{touch-action:none}
.thumb .mark{
  position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 0 2px var(--surface);
}

.stage{flex:1 1 auto;overflow:auto;background:var(--deck);position:relative;min-width:0}
/* 書類は中央に置くが、画面より広く拡大したときは左端から並べる。
   align-items:center のままだと、はみ出した左側がスクロールで届かない
   領域に出てしまい、ページの左端が見えなくなっていた。
   入れ物を一番広いページに合わせて広げ、ページは左右の auto 余白で
   中央に置く（auto 余白は負にならないので、はみ出しは右へ逃げる）。 */
.sheetwrap{
  display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:18px 16px 60px;
  width:max-content;min-width:100%;box-sizing:border-box;
}
.sheetwrap>.sheet{margin-left:auto;margin-right:auto}
.sheet{position:relative;background:#fff;box-shadow:var(--shadow-md);flex:none}
.sheet canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.sheet .pdfc{z-index:1}
.sheet .anc{z-index:2;touch-action:none}
.sheet .badge{
  position:absolute;top:-1px;left:-1px;z-index:3;
  background:rgba(21,32,43,.72);color:#fff;font-size:10.5px;
  padding:1px 7px;border-radius:0 0 5px 0;font-variant-numeric:tabular-nums;
  pointer-events:none;
}
.sheet.busy::after{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(100deg,#f4f4f4 30%,#ececec 50%,#f4f4f4 70%);
}
.t-select .anc{cursor:default}
.t-draw .anc{cursor:crosshair}
.t-text .anc{cursor:text}
.t-erase .anc{cursor:not-allowed}

.empty-stage{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:#e9edf3;text-align:center;padding:24px;
}
.drop{
  border:2px dashed rgba(255,255,255,.4);border-radius:12px;padding:28px 34px;max-width:420px;
}
.stage.dragging .drop{border-color:#fff;background:rgba(255,255,255,.07)}
#btnSample{
  background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:#fff;
}
#btnSample:hover{background:rgba(255,255,255,.24);border-color:#fff}

/* inline text editor */
#ted{
  position:absolute;z-index:20;transform-origin:0 0;
  border:1px solid var(--accent);border-radius:3px;background:rgba(255,255,255,.96);
  color:#15202b;font-family:var(--ui);line-height:1.5;padding:2px 3px;margin:0;
  resize:none;overflow:hidden;box-shadow:0 0 0 3px rgba(47,93,143,.2);
}

/* toast / overlay */
#toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  box-shadow:var(--shadow-md);font-size:12.5px;max-width:90vw;
}
#busy{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:rgba(12,16,22,.55);backdrop-filter:blur(2px);
}
#busy .card{
  background:var(--surface);color:var(--ink);padding:18px 26px;border-radius:10px;
  box-shadow:var(--shadow-md);display:flex;align-items:center;gap:12px;
}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* 印刷。画面の部品は刷らず、書き出しと同じ内容を画像にしたものだけを刷る */
#printArea,#printNote{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printArea):not(#printNote){display:none!important}
  body.printing #printArea{display:block}
  body:not(.printing) #printNote{display:block;font:14px/1.7 sans-serif;color:#000;padding:20mm}
  #printArea .pp{overflow:hidden;break-after:page;page-break-after:always;margin:0;padding:0}
  #printArea .pp:last-child{break-after:auto;page-break-after:auto}
  #printArea img{display:block;width:100%;height:100%}
}

.modal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(12,16,22,.55);backdrop-filter:blur(2px);
}
.modal .card{
  background:var(--surface);color:var(--ink);padding:20px 22px;border-radius:10px;
  box-shadow:var(--shadow-md);width:min(360px,calc(100vw - 32px));
}
.modal .ttl{font-size:14px;font-weight:700;margin-bottom:6px}
.modal .msg{font-size:12px;color:var(--ink-2);margin-bottom:12px;line-height:1.6}
.modal .msg.err{color:var(--danger)}
.modal input{
  width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--ink);
}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal label.pick{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;cursor:pointer}
.modal label.pick input{width:auto;margin:0}
.modal label.pick.off{opacity:.45;cursor:default}
.modal .fname{display:flex;align-items:center;gap:6px}
.modal .fname input{flex:1 1 auto}
.modal .fname span{font-size:13px;color:var(--ink-2)}

.sheetguide{
  color:#c9d1db;font-size:11.5px;text-align:center;padding:0 16px 6px;
}

/* ---------- ページ整理モード ---------- */
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.seg button{
  border:0;background:transparent;padding:5px 14px;border-radius:6px;
  font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}

.orgbar{
  display:flex;align-items:center;gap:2px;flex:none;
  padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
.orgcount{font-size:13px;color:var(--accent);font-weight:600;margin-right:10px;white-space:nowrap}
.act{
  display:inline-flex;align-items:center;gap:6px;padding:7px 11px;
  border:1px solid transparent;border-radius:var(--r);background:transparent;
  color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
}
.act:hover:not(:disabled){background:var(--surface-2)}
.act:disabled{opacity:.38;cursor:default}
.act svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.act.danger,.act.danger svg{color:var(--danger)}

.orgview{flex:1 1 auto;min-height:0;overflow:auto;background:var(--paper);padding:22px 24px 40px}
.orggrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,190px),1fr));
  gap:22px;align-content:start;
}
.ocard{position:relative;cursor:pointer;user-select:none}
.ocard .shot{
  background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.ocard .shot img{display:block;max-width:100%;max-height:100%;-webkit-user-drag:none}
.ocard[aria-selected="true"] .shot{border:2px solid var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ocard .no{text-align:center;font-size:12px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.ocard[aria-selected="true"] .no{color:var(--accent);font-weight:700}
.ocard .mark{
  position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 0 2px var(--surface);
}
.ocard .hov{
  position:absolute;left:0;right:0;top:0;display:none;justify-content:center;gap:4px;padding:7px;
}
.ocard:hover .hov,.ocard:focus-within .hov{display:flex}
.ocard .hb{
  display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);
}
.ocard .hb:hover{background:var(--surface-2)}
.ocard .hb.danger{color:var(--danger)}
.ocard .hb svg{width:16px;height:16px}
.ocard .rotbadge{
  position:absolute;left:8px;bottom:30px;font-size:10px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
}
.ocard.grabbed{opacity:.4}
.ocard.dropbefore::before,.ocard.dropafter::after{
  content:"";position:absolute;top:0;bottom:26px;width:3px;background:var(--accent);border-radius:2px;
}
.ocard.dropbefore::before{left:-13px}
.ocard.dropafter::after{right:-13px}
.ins{
  position:absolute;left:-24px;top:0;bottom:26px;width:26px;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
.ocard:hover .ins,.ins:focus-within{opacity:1}
.insb{
  width:22px;height:22px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--accent);cursor:pointer;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;
}
.insb:hover{background:var(--accent-soft)}
.insb svg{width:12px;height:12px}
.orgstatus{
  flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;height:30px;
  background:var(--surface);border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-2);
}
.orgempty{color:var(--ink-2);font-size:13px;padding:40px 0;text-align:center}
/* 整理中は、書き込み用の操作をしまう */
body.organizing .appbar .field:not(#modeSeg){display:none}
body.organizing .appbar #findBox{display:none}
.orgbar #orgSize{width:80px;margin-right:2px}
/* 白紙は中身が無いと分からないので、地を入れる */
.ocard .shot.blank{
  border-style:dashed;
  background:repeating-linear-gradient(45deg,#fff,#fff 7px,#f4f6fa 7px,#f4f6fa 14px);
}
@media (max-width:760px){ .wide-only{display:none} }

/* ---------- 文脈メニュー・浮動バー ---------- */
.menu{
  position:fixed;z-index:75;min-width:210px;padding:5px 0;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow-md);color:var(--ink);
}
.menu .mh{font-size:11px;color:var(--ink-2);padding:4px 14px 6px}
.menu button{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 14px;border:0;background:transparent;color:inherit;
  font:inherit;font-size:13px;text-align:left;cursor:pointer;
}
.menu button:hover:not(:disabled){background:var(--surface-2)}
.menu button:disabled{opacity:.4;cursor:default}
.menu button svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{color:var(--danger)}
.menu .mk{margin-left:auto;font-size:11px;color:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:5px 0}

.floatbar{
  position:absolute;z-index:6;display:flex;align-items:center;gap:3px;
  padding:5px 7px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow-md);
}
.floatbar .fb{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;
  border:0;border-radius:6px;background:transparent;color:var(--ink);
  font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.floatbar .fb:hover{background:var(--surface-2)}
.floatbar .fb.danger{color:var(--danger)}
.floatbar .fb svg{width:16px;height:16px;flex:none}
.floatbar label{font-size:11px;color:var(--ink-2);padding:0 2px}
.floatbar input[type=range]{width:64px}
.floatbar .tip{
  position:absolute;left:var(--tipx,24px);bottom:-6px;width:11px;height:11px;
  background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:rotate(45deg);
}
.floatbar.below .tip{bottom:auto;top:-6px;transform:rotate(225deg)}

/* ---------- ページ一覧の開閉 ---------- */
.main{position:relative}
.main.rail-closed .rail{display:none}
#railOpen{
  position:absolute;left:10px;top:10px;z-index:5;
  padding:5px 9px;font-size:12px;
}
.scrim{position:absolute;inset:0;z-index:9;background:rgba(12,16,22,.45)}
.docmeta{display:none;flex-direction:column;justify-content:center;min-width:0;flex:1 1 auto}
.docmeta b{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docmeta span{font-size:10.5px;color:var(--ink-2)}
.only-narrow{display:none}

/* ---------- 狭い画面 ---------- */
@media (max-width:760px){
  .only-narrow{display:inline-flex}
  .appbar{
    flex-wrap:nowrap;gap:2px;padding:4px 6px;
    padding-top:calc(4px + env(safe-area-inset-top,0px));
  }
  .appbar .brand,
  .appbar #btnOpen,.appbar #btnAdd,.appbar #btnUndo,.appbar #btnRedo,
  .appbar .field,.appbar .sep,.appbar #btnHelp,.appbar #btnPrint{display:none}
  .appbar #findBox.open-narrow{left:6px;right:6px;width:auto}
  .appbar .spacer{display:none}
  .docmeta{display:flex}
  .appbar .btn{min-width:40px;min-height:40px;justify-content:center}
  .appbar .btn.primary .lb{display:none}
  .appbar #btnExport{padding:8px 12px}

  /* 道具は親指の届く下段へ */
  #app{padding-bottom:0}
  .main{order:2;flex:1 1 auto}
  .toolbar{
    order:3;flex:none;flex-wrap:nowrap;gap:0;padding:0;
    border-bottom:none;border-top:1px solid var(--line);
    flex-direction:column;align-items:stretch;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .toolbar .sep{display:none}
  .props{
    order:1;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line-soft);
    flex-wrap:nowrap;overflow-x:auto;
  }
  .props.empty{display:none}
  .props .field>label{white-space:nowrap}
  .props #btnImage{display:none}
  .sw{width:24px;height:24px}
  input[type=range]{width:78px}
  .toolwrap{order:2;position:relative;min-width:0}
  .toolwrap::after{
    content:"";position:absolute;right:0;top:0;bottom:0;width:26px;
    background:linear-gradient(to right,rgba(255,255,255,0),var(--surface) 72%);
    pointer-events:none;
  }
  .tools{
    gap:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:3px 6px 5px;
  }
  .tools::-webkit-scrollbar{display:none}
  .tool{
    flex:none;width:46px;padding:5px 0;gap:3px;
    flex-direction:column;align-items:center;justify-content:center;
  }
  .tool svg{width:20px;height:20px}
  .tool .lb{display:block;font-size:9.5px;letter-spacing:-.02em}

  /* ページ一覧は引き出し */
  .rail{
    position:absolute;left:0;top:0;bottom:0;z-index:10;
    width:min(310px,84vw);border-right:1px solid var(--line);
    box-shadow:0 0 40px rgba(21,32,43,.35);
    transform:translateX(-101%);transition:transform .18s ease-out;
  }
  .main.rail-open .rail{transform:none}
  .main.rail-closed .rail{display:flex}
  #railOpen{display:none}
  .rail-head{height:52px}
  .thumbs{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;padding:14px 12px 28px;align-content:start;
  }
  .thumb{width:auto}
  .thumb .shot{width:100%}
  .thumb .shot.empty{width:100%;height:150px}
  .pageops{gap:0;padding:4px 6px}
  .pageops .btn{flex:1 1 0;flex-direction:column;gap:3px;padding:7px 0;font-size:10px}
  .pageops .btn .lb{display:block}
}
@media (prefers-reduced-motion:reduce){ .rail{transition:none} }

function hexA(hex, a){
  var h = hex.replace("#",""); if (h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h,16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

/* ------------------------------------------------------------- page model */
function newPage(docId, srcIndex, geo){
  return {
    uid: ++S.uid, docId: docId, srcIndex: srcIndex, rot: 0, annots: [],
    pw: geo.pw, ph: geo.ph, vx0: geo.vx0, vy0: geo.vy0, vy1: geo.vy1,
    irot: geo.irot, blank: !!geo.blank, el: null, vp: null, rendered: false, task: null
  };
}
function totalRot(p){ return ((p.irot + p.rot) % 360 + 360) % 360; }
function dispSize(p, z){
  var r = totalRot(p), w = p.pw*z, h = p.ph*z;
  return (r % 180 === 0) ? {w:w, h:h} : {w:h, h:w};
}
function snapshot(){
  return JSON.stringify(S.pages.map(function(p){
    return {uid:p.uid,docId:p.docId,srcIndex:p.srcIndex,rot:p.rot,annots:p.annots,
      pw:p.pw,ph:p.ph,vx0:p.vx0,vy0:p.vy0,vy1:p.vy1,irot:p.irot,blank:p.blank};
  }));
}
/* 元に戻す履歴は1件ごとに全ページ分の状態を持つので、件数だけでなく
   合計の大きさでも上限を設ける。書き込みの多い文書で膨らみ続けるのを防ぐ。 */
var HISTORY_MAX = 40, HISTORY_BYTES = 6 * 1024 * 1024;
function histPush(stack, snap){
  stack.push(snap);
  stack.bytes = (stack.bytes || 0) + snap.length;
  while (stack.length > 1 && (stack.length > HISTORY_MAX || stack.bytes > HISTORY_BYTES)){
    stack.bytes -= stack.shift().length;
  }
}
function histPop(stack){
  var snap = stack.pop();
  if (snap) stack.bytes = (stack.bytes || 0) - snap.length;
  return snap;
}
function pushHistory(){
  scheduleSave();
  histPush(S.history, snapshot());
  S.future.length = 0; S.future.bytes = 0;
  syncUndo();
}
function restore(json){
  var arr = JSON.parse(json);
  S.pages = arr.map(function(o){
    var p = newPage(o.docId, o.srcIndex, o);
    p.uid = o.uid; p.rot = o.rot; p.annots = o.annots; p.blank = o.blank;
    return p;
  });
  S.uid = Math.max.apply(null, [S.uid].concat(S.pages.map(function(p){return p.uid;})));
  S.active = null;
  var keep = new Set(S.pages.map(function(p){return p.uid;}));
  S.sel = new Set(Array.from(S.sel).filter(function(u){ return keep.has(u); }));
  buildSheets(); buildThumbs(); if (inOrganize()) buildOrg();
}
function undo(){
  if (!S.history.length) return;
  scheduleSave();
  histPush(S.future, snapshot());
  restore(histPop(S.history)); syncUndo();
}
function redo(){
  if (!S.future.length) return;
  scheduleSave();
  histPush(S.history, snapshot());
  restore(histPop(S.future)); syncUndo();
}
function syncUndo(){
  $("btnUndo").disabled = !S.history.length;
  $("btnRedo").disabled = !S.future.length;
}

/* ---------------------------------------------------------- ダイアログ */
function modal(inner, setup){
  return new Promise(function(resolve){
    var back = document.createElement("div");
    back.className = "modal"; back.id = "pwask";
    back.innerHTML = inner;
    var done = false;
    function finish(v){ if (done) return; done = true; back.remove(); resolve(v); }
    document.body.appendChild(back);
    setup(back, finish);
  });
}
function askRestore(when){
  var d = new Date(when);
  var ts = (d.getMonth()+1) + "月" + d.getDate() + "日 " +
           String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return modal(
    '<div class="card" role="dialog" aria-modal="true" aria-labelledby="rsttl">' +
      '<div class="ttl" id="rsttl">前回の続きがあります</div>' +
      '<div class="msg">' + ts + ' に編集していた内容がこの端末に残っています。開きますか。</div>' +
      '<div class="row">' +
        '<button class="btn ghost" data-a="no">新しく始める</button>' +
        '<button class="btn primary" data-a="yes">続きを開く</button>' +
      '</div>' +
    '</div>',
    function(back, finish){
      back.addEventListener("click", function(e){
        var a = e.target.closest("[data-a]");
        if (a) finish(a.dataset.a === "yes");
      });
      back.addEventListener("keydown", function(e){
        e.stopPropagation();
        if (e.key === "Escape"){ e.preventDefault(); finish(false); }
      });
      back.querySelector('[data-a="yes"]').focus();
    }
  );
}

/* ページの組み替えだけに画面を使うモード。細いページ一覧では狭い、
   10ページを超える資料の並べ替え・抜き差しのために用意する。 */
var orgSize = 190;
try { orgSize = clamp(parseInt(localStorage.getItem("pdfk.orgsize"), 10) || 190, 130, 300); } catch(e){}

function inOrganize(){ return S.mode === "organize"; }
function setMode(m){
  if (S.mode === m) return;
  if (m === "organize" && S.editing) commitText();
  S.mode = m;
  var org = (m === "organize");
  $("modeEdit").setAttribute("aria-pressed", org ? "false" : "true");
  $("modeOrg").setAttribute("aria-pressed", org ? "true" : "false");
  document.querySelector(".toolbar").hidden = org;
  $("main").hidden = org;
  document.body.classList.toggle("organizing", org);
  $("orgBar").hidden = $("orgView").hidden = $("orgStatus").hidden = !org;
  if (org){ killFloatbar(); buildOrg(); }
  else { buildSheets(); buildThumbs(); }
}

function orgCardHeight(){ return Math.round(orgSize * 1.35); }

function buildOrg(){
  var grid = $("orgGrid");
  grid.textContent = "";
  grid.style.setProperty("--cw", orgSize + "px");
  $("orgSize").value = String(orgSize);
  if (!S.pages.length){
    var e = document.createElement("div");
    e.className = "orgempty";
    e.textContent = "PDFを開くと、ここでページを並べ替えられます。";
    grid.appendChild(e);
    syncOrgBar();
    return;
  }
  S.pages.forEach(function(p, i){
    var el = document.createElement("div");
    el.className = "ocard";
    el.dataset.uid = p.uid;
    el.tabIndex = 0;
    el.setAttribute("role", "option");
    el.setAttribute("aria-selected", S.sel.has(p.uid) ? "true" : "false");
    el.setAttribute("aria-label", (i + 1) + "ページ目");

    var shot = document.createElement("div");
    shot.className = "shot" + (p.blank ? " blank" : "");
    shot.style.height = orgCardHeight() + "px";
    var no = document.createElement("div");
    no.className = "no";
    no.textContent = (i + 1) + (p.blank ? "　白紙" : "");
    el.appendChild(shot); el.appendChild(no);

    if (p.annots.length){
      var m = document.createElement("i"); m.className = "mark"; el.appendChild(m);
    }
    if (totalRot(p)){
      var rb = document.createElement("span");
      rb.className = "rotbadge"; rb.textContent = totalRot(p) + "°";
      el.appendChild(rb);
    }

    var hov = document.createElement("div");
    hov.className = "hov";
    hov.appendChild(orgHoverBtn("左に回転", ICON.rotL, function(){ orgOne(p, function(){ p.rot = ((p.rot - 90) % 360 + 360) % 360; }); }));
    hov.appendChild(orgHoverBtn("右に回転", ICON.rotR, function(){ orgOne(p, function(){ p.rot = ((p.rot + 90) % 360 + 360) % 360; }); }));
    hov.appendChild(orgHoverBtn("削除", ICON.del, function(){
      pushHistory();
      S.pages = S.pages.filter(function(q){ return q !== p; });
      S.sel.delete(p.uid);
      pruneDocs(); buildOrg();
    }, true));
    el.appendChild(hov);

    var ins = document.createElement("div");
    ins.className = "ins";
    var ib = document.createElement("button");
    ib.type = "button"; ib.className = "insb";
    ib.setAttribute("aria-label", (i + 1) + "ページ目の前に挿入");
    ib.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    ib.addEventListener("click", function(ev){
      ev.stopPropagation();
      insertMenu(i, ev.currentTarget.getBoundingClientRect());
    });
    ins.appendChild(ib);
    el.appendChild(ins);

    grid.appendChild(el);
    thumbFor(p).then(function(url){
      var img = new Image();
      img.src = url; img.alt = ""; img.draggable = false;
      shot.appendChild(img);
    }).catch(function(){});
  });
  syncOrgBar();
}
function orgHoverBtn(label, icon, run, danger){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "hb" + (danger ? " danger" : "");
  b.setAttribute("aria-label", label);
  b.title = label;
  b.innerHTML = svg(icon);
  b.addEventListener("click", function(e){ e.stopPropagation(); run(); });
  return b;
}

function insertBlankAt(idx){
  var ref = S.pages[Math.min(idx, S.pages.length - 1)];
  var w = ref ? ref.pw : 595.28, h = ref ? ref.ph : 841.89;

  var np = newPage(null, -1, {pw:w, ph:h, vx0:0, vy0:0, vy1:h, irot:0, blank:true});
  S.pages.splice(idx, 0, np);

function svg(d){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
         'stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
}
var openMenu = null;
function closeMenu(){
  if (!openMenu) return;
  openMenu.remove();
  openMenu = null;
}
/* items: {label, icon, key, danger, disabled, run} / "-" で区切り線 */
function showMenu(x, y, items, head){
  closeMenu();
  var el = document.createElement("div");
  el.className = "menu";
  el.setAttribute("role", "menu");
  if (head) el.innerHTML = '<div class="mh">' + head + '</div>';
  items.forEach(function(it){
    if (it === "-"){ el.appendChild(document.createElement("hr")); return; }
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "menuitem");
    if (it.danger) b.className = "danger";
    if (it.disabled) b.disabled = true;
    b.innerHTML = (it.icon ? svg(it.icon) : '<span style="width:16px"></span>') +
                  '<span>' + it.label + '</span>' +
                  (it.key ? '<span class="mk">' + it.key + '</span>' : "");
    b.addEventListener("click", function(){
      closeMenu();
      if (it.run) it.run();
    });
    el.appendChild(b);
  });
  document.body.appendChild(el);
  // 画面からはみ出さない位置に寄せる
  var r = el.getBoundingClientRect();
  var left = Math.min(x, window.innerWidth  - r.width  - 8);
  var top  = Math.min(y, window.innerHeight - r.height - 8);
  el.style.left = Math.max(8, left) + "px";
  el.style.top  = Math.max(8, top)  + "px";
  openMenu = el;
  var first = el.querySelector("button:not(:disabled)");
  if (first) first.focus();
  return el;
}
document.addEventListener("pointerdown", function(e){
  if (openMenu && !e.target.closest(".menu")) closeMenu();
}, true);
window.addEventListener("blur", closeMenu);
document.addEventListener("keydown", function(e){
  if (openMenu && e.key === "Escape"){ e.stopPropagation(); closeMenu(); }
}, true);

      '<div class="row"><button class="btn primary" data-a="ok">閉じる</button></div>' +
    '</div>',
    function(back, finish){
      back.addEventListener("click", function(e){
        var a = e.target.closest("[data-a]");
        if (a && a.dataset.a === "wipe"){
          wipeSaved(back.querySelector("#wipeMsg"));
          return;
        }
        if (a || e.target === back) finish(true);
      });
      back.addEventListener("keydown", function(e){
        e.stopPropagation();
        if (e.key === "Escape"){ e.preventDefault(); finish(true); }
      });
      back.querySelector('[data-a="ok"]').focus();
    }
  );
}

/* ------------------------------------------------------ パスワード入力 */
function askPassword(fileName, retry){
  return new Promise(function(resolve){
    var back = document.createElement("div");
    back.className = "modal"; back.id = "pwask";
    back.innerHTML =
      '<div class="card" role="dialog" aria-modal="true" aria-labelledby="pwttl">' +
        '<div class="ttl" id="pwttl">パスワードが必要です</div>' +
        '<div class="msg"></div>' +
        '<input type="password" autocomplete="current-password" aria-label="パスワード">' +
        '<div class="row">' +
          '<button class="btn ghost" data-a="cancel">キャンセル</button>' +
          '<button class="btn primary" data-a="ok">開く</button>' +
        '</div>' +
      '</div>';
    var msg = back.querySelector(".msg");
    msg.textContent = retry
      ? "パスワードが違います。もう一度入力してください。"
      : "「" + fileName + "」はパスワードで保護されています。";
    if (retry) msg.className = "msg err";
    var input = back.querySelector("input");
    var done = false;
    function finish(v){
      if (done) return;
      done = true;
      back.remove();
      resolve(v);
    }
    back.addEventListener("click", function(e){
      var a = e.target.closest("[data-a]");
      if (!a) return;
      finish(a.dataset.a === "ok" ? input.value : null);
    });
    back.addEventListener("keydown", function(e){
      e.stopPropagation();
      if (e.key === "Enter"){ e.preventDefault(); finish(input.value); }
      if (e.key === "Escape"){ e.preventDefault(); finish(null); }
    });
    document.body.appendChild(back);
    input.focus();
  });
}

/* ------------------------------------------------ 自動保存（この端末の中） */
/* 編集内容は IndexedDB に置くだけで、どこにも送信しない。 */
var DB_NAME = "pdf-koubou", STORE = "session";
var dbp = null;
function db(){
  if (!dbp){
    dbp = new Promise(function(resolve, reject){
      var rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore(STORE); };
      rq.onsuccess = function(){ resolve(rq.result); };
      rq.onerror   = function(){ reject(rq.error); };
    }).catch(function(){ return null; });
  }
  return dbp;
}
async function idbPut(key, val){
  var d = await db(); if (!d) return false;
  return new Promise(function(resolve){
    try{
      var tx = d.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = tx.onabort = function(){ resolve(false); };
    }catch(e){ resolve(false); }
  });
}
async function idbGet(key){
  var d = await db(); if (!d) return null;
  return new Promise(function(resolve){
    try{
      var rq = d.transaction(STORE, "readonly").objectStore(STORE).get(key);
      rq.onsuccess = function(){ resolve(rq.result || null); };
      rq.onerror   = function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}
async function idbClear(){
  var d = await db(); if (!d) return;
  try{
    var tx = d.transaction(STORE, "readwrite");
    tx.objectStore(STORE).clear();
  }catch(e){}
}

var saveTimer = null, docsDirty = false;
function scheduleSave(docsChanged){
  if (S.noSave) return;
  if (docsChanged) docsDirty = true;
  S.unsaved = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1500);
}
async function doSave(){
  if (!S.pages.length){ await idbClear(); S.unsaved = false; docsDirty = true; return; }
  var ok = true;
  if (docsDirty){
    var used = new Set(S.pages.map(function(p){ return p.docId; }));
    var docs = [];
    S.docs.forEach(function(v, k){
      if (used.has(k)) docs.push({id:k, name:v.name, bytes:v.bytes});
    });
    ok = await idbPut("docs", docs);
    if (ok) docsDirty = false;
  }
  if (ok){
    var imgs = [];
    S.images.forEach(function(v, k){ imgs.push({id:k, url:v.url}); });
    ok = await idbPut("state", {
      pages: snapshot(), images: imgs, uid: S.uid, docSeq: S.docSeq, at: Date.now()
    });
  }
  S.unsaved = !ok;   // 保存できなければ、閉じるときに警告する
}

async function restoreSession(st){
  var docs = await idbGet("docs") || [];
  for (var i=0;i<docs.length;i++){
    var pdf = await openPdfData(docs[i].bytes, docs[i].name);
    S.docs.set(docs[i].id, {name:docs[i].name, bytes:docs[i].bytes, pdf:pdf});
  }
  (st.images || []).forEach(function(r){
    var im = new Image();
    im.onload = function(){ repaintAll(); };
    im.src = r.url;
    S.images.set(r.id, {url:r.url, el:im});
  });
  S.uid = st.uid || 0;
  S.docSeq = st.docSeq || 0;
  restore(st.pages);          // ページ一覧とサムネイルを組み直す
  S.unsaved = false;
  requestAnimationFrame(fitWidth);
}

/* -------------------------------------------------------------- importing */
var pageCache = new Map();
function getPdfPage(p){
  if (p.blank) return Promise.resolve(null);
  var key = p.docId + ":" + p.srcIndex;
  if (pageCache.has(key)) return pageCache.get(key);
  var pr = S.docs.get(p.docId).pdf.getPage(p.srcIndex + 1);
  pageCache.set(key, pr);
  return pr;
}

/* パスワードが要るPDFなら入力を求めながら開く。取り消されたら
   err.cancelled を立てて投げる。 */
async function openPdfData(bytes, name){
  var task = pdfjsLib.getDocument({data: bytes.slice(0), isEvalSupported:false});
  var INCORRECT = (pdfjsLib.PasswordResponses && pdfjsLib.PasswordResponses.INCORRECT_PASSWORD) || 2;
  var cancelled = false;
  task.onPassword = function(cb, reason){
    busy(null);                               // 読み込み中の表示を一旦どける
    askPassword(name, reason === INCORRECT).then(function(pw){
      if (pw === null){ cancelled = true; task.destroy(); return; }
      busy("PDFを読み込んでいます…");
      cb(pw);
    });
  };
  try {
    return await task.promise;
  } catch(e){
    if (cancelled){ var ce = new Error("cancelled"); ce.cancelled = true; throw ce; }
    throw e;
  }
}

/* どのページからも、元に戻す履歴からも参照されなくなったPDFを捨てる。
   差し替えで開いたときに古いPDFが残り続けるのを防ぐ。 */
function pruneDocs(){
  var used = new Set(), live = new Set();
  S.pages.forEach(function(p){ if (p.docId) used.add(p.docId); live.add(p.uid); });
  Array.from(markedThumbs.keys()).forEach(function(u){ if (!live.has(u)) markedThumbs.delete(u); });
  var hist = S.history.concat(S.future).join("");
  Array.from(S.docs.keys()).forEach(function(id){
    if (used.has(id) || hist.indexOf('"docId":"' + id + '"') >= 0) return;
    var rec = S.docs.get(id);
    S.docs.delete(id);
    Array.from(pageCache.keys()).forEach(function(k){
      if (k.indexOf(id + ":") === 0) pageCache.delete(k);
    });
    Array.from(thumbCache.keys()).forEach(function(k){
      if (k.indexOf(id + ":") === 0) thumbCache.delete(k);
    });
    Array.from(thumbUrls.keys()).forEach(function(k){
      if (k.indexOf(id + ":") === 0) thumbUrls.delete(k);
    });
    try { rec.pdf.destroy(); } catch(e){}
  });
}

async function openBytes(bytes, name, replace, at){
  var id = "d" + (++S.docSeq);
  var pdf = await openPdfData(bytes, name);
  S.docs.set(id, {name: name, bytes: bytes, pdf: pdf});
  var added = [];
  for (var i = 0; i < pdf.numPages; i++){
    var pg = await pdf.getPage(i+1);
    var v = pg.view;
    added.push(newPage(id, i, {
      pw: v[2]-v[0], ph: v[3]-v[1], vx0: v[0], vy0: v[1], vy1: v[3],
      irot: ((pg.rotate % 360) + 360) % 360
    }));
    pageCache.set(id+":"+i, Promise.resolve(pg));
  }
  if (replace){ S.pages = added; S.sel = new Set();
    S.history.length = 0; S.history.bytes = 0;
    S.future.length = 0;  S.future.bytes = 0; syncUndo(); }
  else {
    pushHistory();
    if (typeof at === "number"){
      var k = clamp(at, 0, S.pages.length);
      S.pages = S.pages.slice(0, k).concat(added, S.pages.slice(k));
      S.sel = new Set(added.map(function(q){ return q.uid; }));
    } else {
      S.pages = S.pages.concat(added);
    }
  }
  pruneDocs();
  scheduleSave(true);
  if (inOrganize()) buildOrg();
  buildSheets(); buildThumbs();
  if (replace) requestAnimationFrame(fitWidth);
  return added;
}

async function handleFiles(list, replace, at){
  var files = Array.from(list).filter(function(f){
    return f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  });
  if (!files.length){ toast("PDFファイルを選んでください"); return; }
  busy("PDFを読み込んでいます…");
  var opened = 0, skipped = 0;
  try{
    for (var i=0;i<files.length;i++){
      var buf = new Uint8Array(await files[i].arrayBuffer());
      try{
        await openBytes(buf, files[i].name, replace && opened===0,
                        (typeof at === "number") ? at + opened : undefined);
        opened++;
      }catch(err){
        if (!err || !err.cancelled) throw err;   // パスワード入力の取り消しは飛ばして次へ
        skipped++;
      }
    }
    if (opened) toast(opened + "件のPDFを読み込みました" + (skipped ? "（" + skipped + "件は取り消し）" : ""));
    else if (skipped) toast("読み込みをキャンセルしました");
  }catch(err){
    console.error(err);
    toast("読み込めませんでした。壊れているPDFかもしれません");
  }finally{ busy(null); }
}

/* -------------------------------------------------------------- rendering */
function buildSheets(){
  if (S.editing) commitText();
  fbar = null;                 // シートごと作り直すので参照を捨てる
  sheets.textContent = "";
  $("emptyStage").hidden = S.pages.length > 0;

    p.el = el; p.rendered = false; p.vp = null;

}
function toolClass(){
  if (S.tool === "select") return "select";
  if (S.tool === "text") return "text";
  if (S.tool === "erase") return "erase";
  return "draw";
}
function refreshToolClass(){
  S.pages.forEach(function(p){
    if (p.el) p.el.className = "sheet t-" + toolClass();
  });
  /* 書き込みを選んでいるときは、その書き込みの設定を出す */
  var a = S.active ? S.active.a : null;

  var isText = a ? (a.t === "text") : (S.tool === "text");

  $("fFont").style.display  = isText ? "" : "none";

  $("fColor").style.display = (a ? annotColors(a)     : !(S.tool === "erase" || S.tool === "select")) ? "" : "none";
  if (a){

      $("selSize").value = String(a.size);
      $("selFont").value = a.font || "gothic";
    }

      $("rWidth").value = String(wv); $("wLabel").textContent = wv;
    }
    syncSwatches();
  }
  var props = document.querySelector(".props");

  props.classList.toggle("empty", !any);
